name: Rapli Regatta · validation GFS source

on:
  pull_request:
    paths:
      - 'netlify/functions/gfs-*'
      - 'regatta/gfs-lab.*'
      - 'regatta/index.html'
      - 'tests/regatta-gfs-source.test.cjs'
      - 'tests/regatta-gfs-wind.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/regatta-gfs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gfs-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JS syntax
        run: |
          node --check regatta/gfs-lab.js
          node --check netlify/functions/gfs-wind-core.cjs
          node --check netlify/functions/gfs-wind.js
      - name: Verify GRIB source and vector sampling
        run: node --test tests/regatta-gfs-source.test.cjs tests/regatta-gfs-wind.test.cjs
      - name: Live NOAA GFS 0.25 wind sample (diagnostic only)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          node - <<'JS'
          const {handler} = require('./netlify/functions/gfs-wind.js');
          handler({httpMethod:'GET'}).then(response=>{
            const result=JSON.parse(response.body);
            if(response.statusCode!==200 || result.wind?.verifiedWind!==true){
              throw Error(result.error||'Aucune mesure NOAA');
            }
            console.log('VENT GFS RÉEL',JSON.stringify({
              cycle:result.cycleUTC,valid:result.validUTC,
              lat:result.wind.nearestGridpoint.latitude,
              lon:result.wind.nearestGridpoint.longitude,
              uMs:result.wind.uMs,vMs:result.wind.vMs,
              speedKnots:result.wind.speedKnots,
              directionFromDeg:result.wind.directionFromDeg
            }));
          }).catch(error=>{console.error('ESSAI NOAA INCONCLUSIF',error.message);process.exitCode=1;});
          JS
