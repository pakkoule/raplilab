name: Rapli Regatta · validation GFS source

on:
  pull_request:
    paths:
      - 'netlify/functions/gfs-*'
      - 'regatta/gfs-lab.*'
      - 'regatta/index.html'
      - 'tests/regatta-gfs-source.test.cjs'
      - 'tests/regatta-gfs-wind.test.cjs'
      - 'tests/regatta-gfs-interpolation.test.cjs'
      - 'tests/regatta-gfs-spatial.test.cjs'
      - 'tests/regatta-gfs-spatiotemporal.test.cjs'
      - 'regatta/gfs-interpolation.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/regatta-gfs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gfs-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JS syntax
        run: |
          node --check regatta/gfs-lab.js
          node --check regatta/gfs-interpolation.js
          node --check netlify/functions/gfs-wind-core.cjs
          node --check netlify/functions/gfs-spatial-core.cjs
          node --check netlify/functions/gfs-wind.js
      - name: Verify GRIB source and vector sampling
        run: node --test tests/regatta-gfs-source.test.cjs tests/regatta-gfs-wind.test.cjs tests/regatta-gfs-interpolation.test.cjs tests/regatta-gfs-spatial.test.cjs tests/regatta-gfs-spatiotemporal.test.cjs
