name: Rapli Regatta · essai réel NOAA (unique)

on:
  push:
    branches:
      - feat/color-variations
    paths:
      - '.github/workflows/regatta-gfs-live.yml'

permissions:
  contents: read

jobs:
  actual-noaa-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch and decode one NOAA GFS 0.25° GRIB2 frame
        run: |
          node - <<'JS'
          const {handler} = require('./netlify/functions/gfs-wind.js');
          handler({httpMethod:'GET'}).then(response=>{
            const result=JSON.parse(response.body);
            if(response.statusCode!==200 || !result.ok || result.wind?.verifiedWind!==true){
              throw Error(result.error||'Décodage météo non confirmé');
            }
            const w=result.wind;
            console.log(JSON.stringify({
              model:result.model,
              cycleUTC:result.cycleUTC,
              validUTC:result.validUTC,
              site:w.site,
              nearestGridpoint:w.nearestGridpoint,
              U:w.uMs,V:w.vMs,
              speedKnots:w.speedKnots,directionFromDeg:w.directionFromDeg,
              verifiedWind:w.verifiedWind
            },null,2));
          }).catch(error=>{console.error(error);process.exitCode=1;});
          JS
