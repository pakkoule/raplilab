name: Rapli Regatta · championnat LPDB

on:
  pull_request:
    paths:
      - 'regatta/team-*'
      - 'regatta/index.html'
      - 'regatta/app.js'
      - 'regatta/assets/lpdb.webp'
      - 'tests/regatta-team.test.cjs'
      - 'tests/regatta-visual-refresh.test.cjs'
      - '.github/workflows/regatta-team-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-championship:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check regatta/team-engine.js
          node --check regatta/team-time.js
          node --check regatta/team-rating.js
          node --check regatta/team-export.js
          node --check regatta/team-app.js
          node --check regatta/app.js
      - name: Validate Regatta and collection regression tests
        run: node --test tests/regatta-team.test.cjs tests/regatta-only.test.cjs tests/collection-sync.test.cjs tests/admin-access.test.cjs
