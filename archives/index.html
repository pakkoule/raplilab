/* RAPLI ARCHIVES 1.2 — compact three-module catalogue */
:root{--neon:#35e889;--neon-soft:rgba(53,232,137,.29)}

.mark{display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px;min-width:12px;height:15px;line-height:1}

/* RAPLI ARCHIVES V1.2 — minimal personal catalogue, offline-first. */
'use strict';
const DB_NAME='my-archive-v1', DB_STORE='data', DB_KEY='archive';
const emptyState=()=>({version:1,groups:[],variants:[],copies:[],wishlist:[],createdAt:new Date().toISOString()});
let archive=emptyState(),db=null,storageMode='indexeddb';
let currentView='dashboard',currentGroup=null,currentVariant=null,searchTerm='',activeFilter='all',modalImage=null;
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=h;
const uid=()=>globalThis.crypto?.randomUUID?.() || 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const catForGroup=id=>archive.groups.find(g=>g.id===id)?.category||'dragons';
const getGroup=id=>archive.groups.find(g=>g.id===id);
const getVariant=id=>archive.variants.find(v=>v.id===id);
const ownedCount=id=>archive.copies.filter(c=>c.variantId===id).length;
const wishFor=id=>archive.wishlist.find(w=>w.variantId===id);
const groupVariants=id=>archive.variants.filter(v=>v.groupId===id);
const fmtDate=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const fmtEuro=n=>(n!==null&&n!==undefined&&n!=='')?Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}):'—';
const safeUrl=s=>/^https?:\/\//i.test(String(s||''))?s:'';
const titleFor=v=>v.label||v.reference||'Référence sans nom';
const iconFor=category=>category==='cards'?'▧':category==='dragons'?'🐉':'◷';
const imageFor=v=>/^data:image\/(?:jpeg|png|webp);base64,/i.test(v.image||'')||/^assets\/artworks\/(?:A\d{2}|R0[1-4](?:-X)?)\.webp$/i.test(v.image||'')?`<img src="${attr(v.image)}" alt="Visuel de référence : ${attr(titleFor(v))}" loading="lazy" decoding="async">`:`<span class="placeholder-icon">${iconFor(catForGroup(v.groupId))}</span>`;
function toast(message,isError=false){let root=$('#toast-root');if(!root)return;const node=document.createElement('div');node.className='toast'+(isError?' error':'');node.textContent=message;root.appendChild(node);setTimeout(()=>node.remove(),4200);}
function openStorage(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbOp(type,value){return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,type);const os=tx.objectStore(DB_STORE);const req=type==='readonly'?os.get(DB_KEY):os.put(value,DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function save(){try{
 if(storageMode==='indexeddb')await idbOp('readwrite',archive);
 else if(storageMode==='localstorage')localStorage.setItem(DB_KEY,JSON.stringify(archive));
 // Last persistence on THIS device, not the original creation date of a card.
 if(storageMode!=='memory'){
  const savedAt=now();
  window.rapliArchivesLocalSavedAt=savedAt;
  try{localStorage.setItem('rapli-archives-local-saved-at-v1',savedAt);}catch(_){}
 }
 return true;
}catch(e){console.error('Save failed',e);toast('Enregistrement impossible. Exporte une sauvegarde et vérifie le stockage.',true);return false;}}
async function initialize(){try{db=await openStorage();const saved=await idbOp('readonly');if(saved)archive=normalizeState(saved);}catch(e){console.warn('IndexedDB unavailable:',e);try{localStorage.setItem('__ma_test','1');localStorage.removeItem('__ma_test');storageMode='localstorage';const saved=localStorage.getItem(DB_KEY);if(saved)archive=normalizeState(JSON.parse(saved));toast('Stockage de secours activé : pense à exporter tes sauvegardes.');}catch(err){storageMode='memory';toast('Stockage persistant indisponible : tes modifications seront temporaires.',true);}}await importRapliPdfCatalogue();render();}
function normalizeState(s){if(!s||!Array.isArray(s.groups)||!Array.isArray(s.variants)||!Array.isArray(s.copies)||!Array.isArray(s.wishlist))throw new Error('Fichier de sauvegarde non conforme');return {version:1,groups:s.groups,variants:s.variants,copies:s.copies,wishlist:s.wishlist,createdAt:s.createdAt||now()};}
function navigate(view,group=null,variant=null){currentView=view;currentGroup=group;currentVariant=variant;searchTerm='';activeFilter='all';$('#sidebar')?.classList.remove('open');$('#mobile-backdrop').hidden=true;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const main=$('#main-content');if(!main)return;let breadcrumb='ACCUEIL';let html='';if(currentView==='dashboard'){html=dashboardView();}
else if(currentView==='watches'||currentView==='cards'){const label=currentView==='watches'?'DRAGON BLANC':'DRAGON BLANC';breadcrumb=label;if(currentVariant&&getVariant(currentVariant)){html=variantView(getVariant(currentVariant));breadcrumb+=' / FICHE';}else if(currentGroup&&getGroup(currentGroup)){html=groupView(getGroup(currentGroup));breadcrumb+=' / '+getGroup(currentGroup).name.toUpperCase();}else html=categoryView(currentView);}
else if(currentView==='collection'){breadcrumb='MA COLLECTION';html=collectionView();}
else if(currentView==='wishlist'){breadcrumb='WISHLIST';html=wishlistView();}
else if(currentView==='tools'){breadcrumb='DONNÉES & SAUVEGARDES';html=toolsView();}
else html=dashboardView();main.innerHTML=html;$('#breadcrumb').textContent=breadcrumb;
document.querySelectorAll('.nav-item[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===currentView));$('#watch-total').textContent=archive.variants.filter(v=>catForGroup(v.groupId)==='watches').length;$('#card-total').textContent=archive.variants.filter(v=>catForGroup(v.groupId)==='cards').length;$('#owned-total').textContent=archive.copies.length;$('#wish-total').textContent=archive.wishlist.length;}
function header(eyebrow,title,subtitle='',buttons=''){return `<div class="page-heading"><div>${eyebrow?`<div class="eyebrow">${h(eyebrow)}</div>`:''}<h1>${title}</h1>${subtitle?`<p class="page-subtitle">${subtitle}</p>`:''}</div>${buttons?`<div class="button-row">${buttons}</div>`:''}</div>`;}
function dashboardView(){const w=archive.variants.filter(v=>catForGroup(v.groupId)==='watches').length,c=archive.variants.length-w;

function groupCard(g){
 const variants=groupVariants(g.id),count=variants.length,own=variants.filter(v=>ownedCount(v.id)>0).length;

function referenceCard(v){const own=ownedCount(v.id),wish=wishFor(v.id);const state=own?`<span class="tile-indicator owned" title="Possédée" aria-label="Possédée">✓</span>`:wish?`<span class="tile-indicator wish" title="Wishlist" aria-label="Wishlist">♡</span>`:'';

async function peekOwn(id){const v=getVariant(id);if(!v)return;const copies=archive.copies.filter(c=>c.variantId===id);if(!copies.length){archive.copies.push({id:uid(),variantId:id,condition:'',acquiredAt:'',price:null,serialNo:'',purchaseSource:'',notes:'',createdAt:now(),updatedAt:now()});}else if(copies.length===1){archive.copies=archive.copies.filter(c=>c.id!==copies[0].id);}else{toast('Pour retirer un doublon, utilise × sur son exemplaire.');return;}

async function compressImage(file){if(!file||!file.type.startsWith('image/'))throw new Error('Choisis un fichier image');if(file.size>20*1024*1024)throw new Error('Image trop volumineuse (20 Mo maximum).');const image=await new Promise((resolve,reject)=>{const i=new Image();const url=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(url);resolve(i)};i.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image illisible'))};i.src=url;});const max=1050,ratio=Math.min(1,max/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.78);}
async function legacyOnSaveForm(e){e.preventDefault();const form=e.target,fd=new FormData(form),id=form.dataset.id,type=form.dataset.form,fields=Object.fromEntries([...fd.entries()].filter(([k,v])=>typeof v==='string'));const timestamp=now();

else if(type==='variant'){const groupId=fields.groupId,ref=(fields.reference||'').trim(),label=(fields.label||'').trim()||ref;if(!getGroup(groupId)||!ref)return toast('La famille et la référence sont requises.',true);const isCards=getGroup(groupId).category==='cards';const norm=x=>String(x||'').trim().toLowerCase();if(archive.variants.some(v=>v.id!==id&&v.groupId===groupId&&norm(v.reference)===norm(ref)&&(!isCards||(norm(v.player)===norm(fields.player)&&norm(v.parallel)===norm(fields.parallel)&&norm(v.cardNumber)===norm(fields.cardNumber)))))return toast('Cette variante existe déjà dans ce groupe : ouvre sa fiche ou modifie son identifiant / parallèle.',true);
let img=id?getVariant(id)?.image||'':'';const file=$('#f-image')?.files?.[0];if(file){try{img=await compressImage(file)}catch(e){return toast(e.message,true)}}if(fields.removeImage==='yes')img='';const fresh={groupId,reference:ref,label,image:img,year:fields.year||'',color:fields.color||'',module:fields.module||'',dimensions:fields.dimensions||'',caseMaterial:fields.caseMaterial||'',strap:fields.strap||'',strapColor:fields.strapColor||'',lugWidth:fields.lugWidth||'',availability:fields.availability||'',player:fields.player||'',team:fields.team||'',cardNumber:fields.cardNumber||'',parallel:fields.parallel||'',serial:fields.serial||'',rarity:fields.rarity||'',cardType:fields.cardType||'',edition:fields.edition||'',sourceUrl:safeUrl(fields.sourceUrl||''),notes:fields.notes||'',updatedAt:timestamp};let newId=id;if(id){const v=getVariant(id);if(!v)return;Object.assign(v,fresh)}else{newId=uid();archive.variants.push({id:newId,...fresh,createdAt:timestamp})}currentView=getGroup(groupId).category;currentGroup=groupId;currentVariant=null;}
else if(type==='copy'){if(!getVariant(fields.variantId)||catForGroup(getVariant(fields.variantId).groupId)!=='dragons')return toast('Référence invalide.',true);const fresh={variantId:fields.variantId,condition:fields.condition||'',acquiredAt:fields.acquiredAt||'',price:fields.price===''?null:Number(fields.price),serialNo:fields.serialNo||'',purchaseSource:fields.purchaseSource||'',notes:fields.notes||'',updatedAt:timestamp};if(id){const c=archive.copies.find(x=>x.id===id);if(c)Object.assign(c,fresh)}else archive.copies.push({id:uid(),...fresh,createdAt:timestamp});}

function downloadBlob(content,name,mime='application/json'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function csvCell(s){const str=String(s??'');return /[;\n\r"]/.test(str)?'"'+str.replaceAll('"','""')+'"':str;}
function exportCsv(){const columns=['univers','groupe','marque','saison','sport','reference','titre','annee','coloris','module','bracelet','joueur','equipe','numero_carte','parallele','numerotation','rarete','source','nombre_exemplaires','wishlist'];const rows=archive.variants.map(v=>{const g=getGroup(v.groupId);return [g?.category,g?.name,g?.brand,g?.year,g?.sport,v.reference,v.label,v.year,v.color,v.module,v.strap,v.player,v.team,v.cardNumber,v.parallel,v.serial,v.rarity,v.sourceUrl,ownedCount(v.id),!!wishFor(v.id)];});const txt='\ufeff'+[columns,...rows].map(row=>row.map(csvCell).join(';')).join('\r\n');downloadBlob(txt,'MY_ARCHIVE_references_'+new Date().toISOString().slice(0,10)+'.csv','text/csv;charset=utf-8');toast('CSV exporté.');}
function validateImported(s){const a=normalizeState(s);const allIds=new Set;for(const collection of [a.groups,a.variants,a.copies,a.wishlist])for(const x of collection){if(typeof x!=='object'||!x||typeof x.id!=='string'||!x.id||allIds.has(x.id))throw Error('Identifiants invalides ou dupliqués');allIds.add(x.id)}const gIds=new Set(a.groups.map(g=>g.id)),vIds=new Set(a.variants.map(v=>v.id));if(a.groups.some(g=>!['cards','watches'].includes(g.category))||a.variants.some(v=>!gIds.has(v.groupId))||a.copies.some(c=>!vIds.has(c.variantId))||a.wishlist.some(w=>!vIds.has(w.variantId)))throw Error('Certaines références sont orphelines.');if(new Set(a.wishlist.map(w=>w.variantId)).size!==a.wishlist.length)throw Error('Wishlist contenant des doublons.');return a;}
async function importJson(file){
 if(!file)return {success:false,cancelled:true,message:'Aucun fichier sélectionné.'};
 let gate=null,success=false;
 try{
  if(!/\.json$/i.test(String(file.name||'')))throw Error('Sélectionne un fichier de sauvegarde .json.');
  if(!file.size||file.size>150*1024*1024)throw Error('Fichier vide ou trop volumineux (150 Mo maximum).');
  const parsed=JSON.parse(await file.text());
  const data=validateImported(parsed);
  const originDate=parsed.exportedAt&&Number.isFinite(Date.parse(parsed.exportedAt))
    ?new Date(parsed.exportedAt).toLocaleString('fr-FR')
    :'Date d’export inconnue';
  if(!confirm('Importer « '+file.name+' » ?\n'+originDate+'\n'+
    data.groups.length+' éditions/groupes · '+data.variants.length+' références · '+
    data.copies.length+' exemplaires · '+data.wishlist.length+' souhaits.\n\n'+
    'ATTENTION : cela REMPLACERA la collection locale de cet appareil, sans fusion. '+
    'Exporte sa version actuelle avant de confirmer. Supabase restera inchangé tant que tu ne choisiras pas de la remplacer.'))
    return {success:false,cancelled:true,message:'Import annulé : aucune donnée modifiée.'};
  gate=window.RapliCloud?.beginLocalImport?.();
  if(!gate)throw Error('Protection de synchronisation indisponible : import annulé.');
  const previous=archive;
  archive=data;
  if(!await save()){
    archive=previous;
    return {success:false,error:true,message:'Import non enregistré : les données locales précédentes sont conservées.'};
  }
  success=true;
  navigate('dashboard');
  toast('JSON importé localement. Vérifie le conflit Supabase avant toute synchronisation ✓');
  return {success:true,message:'Sauvegarde JSON importée sur cet appareil ✓ Supabase n’a pas été remplacé. Choisis ensuite la version à conserver.'};
 }catch(e){
  const message='Import impossible : '+(e?.message||'fichier non conforme');
  toast(message,true);
  return {success:false,error:true,message};
 }finally{
  if(gate)window.RapliCloud?.finishLocalImport?.(gate,success);
 }
}
function deleteGroup(id){const group=getGroup(id);if(!group)return;const refs=groupVariants(id);if(!confirm(`Supprimer « ${group.name} » et ses ${refs.length} références, avec tous leurs exemplaires et souhaits ? Cette opération est irréversible sans sauvegarde.`))return;const refIds=new Set(refs.map(v=>v.id));archive.groups=archive.groups.filter(g=>g.id!==id);archive.variants=archive.variants.filter(v=>!refIds.has(v.id));archive.copies=archive.copies.filter(c=>!refIds.has(c.variantId));archive.wishlist=archive.wishlist.filter(w=>!refIds.has(w.variantId));save();navigate(group.category);toast('Groupe supprimé.');}

const defaultTags={
 dragons:{edition:[['Legend of Blue Eyes White Dragon','✦','#8b9fc9'],['Starter Deck Kaiba','◆','#7b9fce'],['Anniversary','★','#d0b777']],rarity:[['Common','●','#8e9799'],['Rare','◆','#5e87c8'],['Super Rare','✧','#78b9c7'],['Ultra Rare','★','#c5a75e'],['Secret Rare','✦','#9e8acb'],['Quarter Century Secret Rare','✶','#d3bd8b']],artwork:[['Original','◈','#6b94c0'],['Alternatif','✧','#9b82cd'],['Anniversaire','★','#dfbd6c']],language:[['Français','🇫🇷','#426dc7'],['Anglais','🇬🇧','#b34e55'],['Japonais','🇯🇵','#be464a'],['Coréen','🇰🇷','#6b90ca'],['Allemand','🇩🇪','#d9ae52'],['Italien','🇮🇹','#4a9c76'],['Espagnol','🇪🇸','#d5ad3f']]}
} ;

function moduleSettings(){if(!archive.settings||typeof archive.settings!=='object')archive.settings=makeDefaultSettings();const defaults=makeDefaultSettings();for(const key of Object.keys(MODULES)){if(!archive.settings[key])archive.settings[key]=defaults[key];if(!archive.settings[key].taxonomies)archive.settings[key].taxonomies={};for(const [field] of MODULES[key].fields){if(!Array.isArray(archive.settings[key].taxonomies[field]))archive.settings[key].taxonomies[field]=defaults[key].taxonomies[field];for(const item of archive.settings[key].taxonomies[field])if(!item.id)item.id=uid();}}return archive.settings;}

/* V1.7 — Actions rapides des tuiles Dragon Blanc */
const bundledArtworkPattern=/^assets\/artworks\/(A\d{2}|R0[1-4](?:-X)?)\.webp$/i;
const embeddedArtworkPattern=/^data:image\/(png|jpeg|jpg|webp);base64,/i;
function canDownloadArtwork(v){
  const src=String(v?.image||'');
  return bundledArtworkPattern.test(src)||embeddedArtworkPattern.test(src);
}
function artworkFileBase(v){
  const part=(value)=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,52);
  const match=String(v.image||'').match(bundledArtworkPattern);
  const code=match?.[1]||String(v.artwork||'').match(/(?:A\d{2}|R0[1-4](?:-X)?)/i)?.[0]||'ARTWORK';
  return 'Dragon_Blanc_'+[part(v.reference)||'Sans_reference',part(code),part(v.languageCode||v.language)].filter(Boolean).join('_');
}
function directDownload(url,filename){
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=filename;
  anchor.style.display='none';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
}
async function copyEditionName(value){
 const name=String(value||'');
 if(!name.trim()){toast('Nom de l’édition indisponible.',true);return;}
 let copied=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(name);copied=true;}}catch(_error){}
 if(!copied){
  const input=document.createElement('textarea');
  input.value=name;input.readOnly=true;input.style.position='fixed';
  input.style.opacity='0';input.style.pointerEvents='none';
  document.body.appendChild(input);input.focus();input.select();
  try{copied=!!document.execCommand('copy');}catch(_error){}
  input.remove();
 }
 toast(copied?'Nom de l’édition copié : '+name:'Impossible de copier le nom de l’édition.',!copied);
}
async function copyVariantReference(id){
  const reference=String(getVariant(id)?.reference||'').trim();
  if(!reference){toast('Aucune référence disponible.',true);return;}
  let copied=false;
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(reference);copied=true;}}catch(_e){}
  if(!copied){
    const input=document.createElement('textarea');
    input.value=reference;input.readOnly=true;
    input.style.position='fixed';input.style.opacity='0';input.style.pointerEvents='none';
    document.body.appendChild(input);input.focus();input.select();
    try{copied=!!document.execCommand('copy');}catch(_e){}
    input.remove();
  }
  toast(copied?'Référence copiée : '+reference:'Copie impossible dans ce navigateur.',!copied);
}
async function downloadVariantArtwork(id){
  const v=getVariant(id);
  if(!v||!canDownloadArtwork(v)){toast('Aucun artwork téléchargeable pour cette carte.',true);return;}
  const src=String(v.image),base=artworkFileBase(v);
  const bundled=src.match(bundledArtworkPattern);
  if(bundled){
    directDownload('assets/artworks/'+bundled[1]+'.png',base+'.png');
    toast('Téléchargement de l’artwork PNG lancé.');return;
  }
  try{
    const mime=src.match(embeddedArtworkPattern)?.[1]?.toLowerCase();
    if(mime==='png'||mime==='jpeg'||mime==='jpg'){
      // Preserve original PNG/JPG bytes and format, rather than recompressing.
      const response=await fetch(src);
      if(!response.ok)throw Error('Image non disponible');
      const blob=await response.blob();
      const blobUrl=URL.createObjectURL(blob);
      directDownload(blobUrl,base+'.'+(mime==='png'?'png':'jpg'));
      setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);
      toast('Téléchargement de l’artwork lancé.');return;
    }
    // For a user-added WebP, convert to lossless PNG (rather than saving as WebP).
    const picture=new Image();
    await new Promise((resolve,reject)=>{picture.onload=resolve;picture.onerror=()=>reject(Error('Image illisible'));picture.src=src;});
    const canvas=document.createElement('canvas');canvas.width=picture.naturalWidth;canvas.height=picture.naturalHeight;
    canvas.getContext('2d').drawImage(picture,0,0);
    const png=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Conversion impossible')),'image/png'));
    const url=URL.createObjectURL(png);directDownload(url,base+'.png');
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('Téléchargement de l’artwork PNG lancé.');
  }catch(err){toast('Téléchargement impossible : '+err.message,true);}
}

function archivePager(total,pageSize=ARCHIVE_PAGE_SIZE){

 archivePage=Math.max(1,Math.min(archivePage,Math.max(1,pages)));
 if(total<=0)return '';
 const visible=new Set([1,pages,archivePage-1,archivePage,archivePage+1].filter(n=>n>=1&&n<=pages));
 const slots=[...visible].sort((a,b)=>a-b);
 let previous=0,links='';
 for(const n of slots){
   if(n-previous>1)links+='<span class="archive-page-ellipsis" aria-hidden="true">…</span>';
   links+='<button type="button" data-action="archive-page" data-page="'+n+'"'+(n===archivePage?' aria-current="page" class="archive-page-active"':'')+' aria-label="Page '+n+' sur '+pages+'">'+n+'</button>';
   previous=n;

 return '<nav class="archive-pagination" aria-label="Pagination du catalogue">'+
  '<button type="button" data-action="archive-page" data-page="'+(archivePage-1)+'" '+(archivePage===1?'disabled':'')+' aria-label="Page précédente">‹</button>'+
  links+'<button type="button" data-action="archive-page" data-page="'+(archivePage+1)+'" '+(archivePage===pages?'disabled':'')+' aria-label="Page suivante">›</button>'+

  let minX=width,minY=height,maxX=-1,maxY=-1;
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      if(pixels[(y*width+x)*4+3]>12){
        minX=Math.min(minX,x); minY=Math.min(minY,y);
        maxX=Math.max(maxX,x); maxY=Math.max(maxY,y);
      }
    }
  }
  if(maxX<0)return source;
  const pad=2;
  minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);
  maxX=Math.min(width-1,maxX+pad);maxY=Math.min(height-1,maxY+pad);
  if(minX===0&&minY===0&&maxX===width-1&&maxY===height-1)return source;
  const trimmed=document.createElement('canvas');
  trimmed.width=maxX-minX+1;trimmed.height=maxY-minY+1;
  trimmed.getContext('2d').drawImage(source,minX,minY,trimmed.width,trimmed.height,0,0,trimmed.width,trimmed.height);
  return trimmed;
}
const editionLogoTrimCache=new Map();
// Older logos were forced into a transparent 100x100 square. Fix their display
// without mutating the user's original cloud data or requiring re-upload.
function enhanceLegacyEditionLogo(img){
  if(!(img instanceof HTMLImageElement)||img.dataset.editionLogoChecked)return;
  if(!img.complete||!img.naturalWidth)return;
  img.dataset.editionLogoChecked='1';
  const source=img.getAttribute('src')||'';
  if(!/^data:image\/png;base64,/i.test(source)||img.naturalWidth!==100||img.naturalHeight!==100)return;
  if(editionLogoTrimCache.has(source)){
    const {src:corrected,width}=editionLogoTrimCache.get(source);
    img.style.width=Math.min(142,Math.max(1,Math.round(width*1.25)))+'px';
    img.style.height='auto';
    if(corrected!==source)img.src=corrected;
    return;
  }
  try{
    const canvas=document.createElement('canvas');
    canvas.width=100;canvas.height=100;
    canvas.getContext('2d').drawImage(img,0,0);
    const trimmed=cropTransparentLogo(canvas);
    const corrected=trimmed===canvas?source:trimmed.toDataURL('image/png');
    editionLogoTrimCache.set(source,{src:corrected,width:trimmed.width});
    // Old 100px-square uploads can NEVER regain lost resolution.
    // Limit them to ~1.25x their true content width; do not stretch to fill the tile.
    img.style.width=Math.min(142,Math.max(1,Math.round(trimmed.width*1.25)))+'px';
    img.style.height='auto';
    if(corrected!==source)img.src=corrected;
  }catch(error){console.warn('Logo édition : suppression des marges ignorée',error);}
}

async function badgeLogo(file){
  if(!file.type.startsWith('image/'))throw Error('Ce fichier n’est pas une image');
  if(file.size>5*1024*1024)throw Error('Logo limité à 5 Mo');
  const image=await new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Logo illisible'));};
    img.src=url;
  });
  const maxWidth=640,maxHeight=260;
  const ratio=Math.min(1,maxWidth/image.naturalWidth,maxHeight/image.naturalHeight);
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));
  canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
  canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
  // Preserve the real shape (including wide horizontal edition logos).
  return cropTransparentLogo(canvas).toDataURL('image/png');
}

function artworkSquarePreview(file){
 return new Promise((resolve,reject)=>{
  if(!file||(!file.type.startsWith('image/')&&!/\.(?:png|jpe?g|webp|heic|heif)$/i.test(file.name||'')))return reject(Error('Sélectionne une image PNG, JPG, WebP ou HEIC.'));
  if(file.size>10*1024*1024)return reject(Error('Image limitée à 10 Mo.'));
  const img=new Image();
  const url=URL.createObjectURL(file);
  const clean=()=>URL.revokeObjectURL(url);
  img.onerror=()=>{clean();reject(Error('Image illisible dans ce navigateur. Essaie un PNG ou JPG si la photo est au format HEIC.'));};
  img.onload=()=>{
   try{
    clean();
    const canvas=document.createElement('canvas');canvas.width=canvas.height=176;
    const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas indisponible.');
    ctx.fillStyle='#f4f9ff';ctx.fillRect(0,0,176,176);
    const side=Math.min(img.naturalWidth,img.naturalHeight);
    if(!side)throw Error('Image sans dimensions lisibles.');
    ctx.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,176,176);
    // JPEG is consistently supported by Safari iOS; small enough for Supabase sync.
    resolve(canvas.toDataURL('image/jpeg',.88));
   }catch(error){reject(error);}
  };
  img.src=url;
 });
}

async function importRapliPdfCatalogue(){
 const source=window.RAPLI_SOURCE_CATALOGUE;
 if(!source||!Array.isArray(source.cards))return;
 const cfg=moduleSettings();
 if(cfg.rapliPdfSeedVersion===source.version)return;
 const norm=v=>String(v||'').normalize('NFKC').toLocaleLowerCase('fr-FR').trim();
 const groupMap=new Map(archive.groups.filter(g=>g.category==='dragons').map(g=>[norm(g.name),g]));
 const existingIds=new Set(archive.variants.map(v=>v.id));
 const existingKeys=new Set(archive.variants.filter(v=>catForGroup(v.groupId)==='dragons').map(v=>[
  v.reference,v.artwork,v.rarity,v.language,v.edition,v.nameColor,v.editionStatus,v.market,v.sourceDate
 ].map(norm).join('|')));
 const sourceRows=source.cards;
 let added=0;
 for(const item of sourceRows){
   if(existingIds.has(item.id))continue;
   const signature=[item.reference,item.artwork,item.rarity,item.language,item.edition,item.nameColor,item.editionStatus,item.market,item.date].map(norm).join('|');
   if(existingKeys.has(signature))continue;
   const name=item.edition||'Origine non renseignée';
   let group=groupMap.get(norm(name));
   if(!group){group={id:'pdf-grp-'+String(groupMap.size+1).padStart(3,'0'),name,category:'dragons',description:'Édition relevée dans le catalogue PDF Rapli Archives',createdAt:'2026-11-10T00:00:00.000Z',updatedAt:'2026-11-10T00:00:00.000Z'};
     while(archive.groups.some(g=>g.id===group.id))group.id+='x';
     archive.groups.push(group);groupMap.set(norm(name),group);
   }
   archive.variants.push({id:item.id,groupId:group.id,reference:item.reference,label:item.reference,image:item.image,
      edition:item.edition,rarity:item.rarity,artwork:item.artwork,language:item.language,languageCode:item.languageCode,
      nameColor:item.nameColor,editionStatus:item.editionStatus,market:item.market,sourceDate:item.date,
      dragonNumber:item.reference,artworkCode:item.artworkCode,pdfPage:item.pdfPage,sourceDocument:item.sourceDoc,
      notes:[item.date,item.market,item.editionStatus,item.detail,'Source : '+source.source+' · p. '+item.pdfPage].filter(Boolean).join(' · '),
      createdAt:'2026-11-10T00:00:00.000Z',updatedAt:'2026-11-10T00:00:00.000Z'});
   existingIds.add(item.id);existingKeys.add(signature);added++;
 }
 // Complete the drop-down taxonomies without replacing customized icons, colors or labels.
 const settings=moduleSettings().dragons;
 const palette=['#71b7f0','#d5ae66','#63c7b0','#bda5ef','#e7a46e','#81a9df','#e1b7dc'];
 const updateTax=(field,label,extra={})=>{
   const values=settings.taxonomies[field];if(!values.some(v=>norm(v.label)===norm(label)))values.push({id:'pdf-'+field+'-'+values.length,label,color:palette[values.length%palette.length],icon:'',logo:'',...extra});
   else if(field==='artwork'){
     const cur=values.find(v=>norm(v.label)===norm(label));if(!cur.preview&&!cur.logo)cur.preview=extra.preview;
   }
 };
 source.artworks.forEach((a,i)=>updateTax('artwork',a.label,{preview:a.preview,icon:''}));
 [...new Set(sourceRows.map(x=>x.rarity))].forEach(v=>updateTax('rarity',v));
 const flags={'FR':'🇫🇷','EN':'🇬🇧','DE':'🇩🇪','IT':'🇮🇹','ES':'🇪🇸','PT':'🇵🇹','JP':'🇯🇵','KR':'🇰🇷','SC':'🇨🇳','TC':'🇹🇼'};
 [...new Map(sourceRows.map(x=>[x.language,x.languageCode])).entries()].forEach(([v,k])=>updateTax('language',v,{icon:flags[k]||''}));
 [...new Set(sourceRows.map(x=>x.edition))].forEach(v=>updateTax('edition',v));
 cfg.rapliPdfSeedVersion=source.version;
 await save();
}
