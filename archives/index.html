/* RAPLI ARCHIVES 1.2 — compact three-module catalogue */
:root{--neon:#35e889;--neon-soft:rgba(53,232,137,.29)}

.mark{display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px;min-width:12px;height:15px;line-height:1}

<script>
/* RAPLI ARCHIVES V1.2 — minimal personal catalogue, offline-first. */
'use strict';
const DB_NAME='my-archive-v1', DB_STORE='data', DB_KEY='archive';
const emptyState=()=>({version:1,groups:[],variants:[],copies:[],wishlist:[],createdAt:new Date().toISOString()});
let archive=emptyState(),db=null,storageMode='indexeddb';
let currentView='dashboard',currentGroup=null,currentVariant=null,searchTerm='',activeFilter='all',modalImage=null;
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=h;
const uid=()=>globalThis.crypto?.randomUUID?.() || 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const catForGroup=id=>archive.groups.find(g=>g.id===id)?.category||'dragons';
const getGroup=id=>archive.groups.find(g=>g.id===id);
const getVariant=id=>archive.variants.find(v=>v.id===id);
const ownedCount=id=>archive.copies.filter(c=>c.variantId===id).length;
const wishFor=id=>archive.wishlist.find(w=>w.variantId===id);
const groupVariants=id=>archive.variants.filter(v=>v.groupId===id);
const fmtDate=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const fmtEuro=n=>(n!==null&&n!==undefined&&n!=='')?Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}):'—';
const safeUrl=s=>/^https?:\/\//i.test(String(s||''))?s:'';
const titleFor=v=>v.label||v.reference||'Référence sans nom';
const variantSubtitle=v=>[v.reference,v.parallel,v.color,v.player].filter(Boolean).join(' · ');
const iconFor=category=>category==='cards'?'▧':category==='dragons'?'🐉':'◷';
const imageFor=v=>/^data:image\/(?:jpeg|png|webp);base64,/i.test(v.image||'')||/^assets\/artworks\/(?:A\d{2}|R0[1-4](?:-X)?)\.webp$/i.test(v.image||'')?`<img src="${attr(v.image)}" alt="Visuel de référence : ${attr(titleFor(v))}" loading="lazy" decoding="async">`:`<span class="placeholder-icon">${iconFor(catForGroup(v.groupId))}</span>`;
function toast(message,isError=false){let root=$('#toast-root');if(!root)return;const node=document.createElement('div');node.className='toast'+(isError?' error':'');node.textContent=message;root.appendChild(node);setTimeout(()=>node.remove(),4200);}
function openStorage(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbOp(type,value){return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,type);const os=tx.objectStore(DB_STORE);const req=type==='readonly'?os.get(DB_KEY):os.put(value,DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function save(){try{if(storageMode==='indexeddb')await idbOp('readwrite',archive);else if(storageMode==='localstorage')localStorage.setItem(DB_KEY,JSON.stringify(archive));return true;}catch(e){console.error('Save failed',e);toast('Enregistrement impossible. Exporte une sauvegarde et vérifie le stockage.',true);return false;}}
async function initialize(){try{db=await openStorage();const saved=await idbOp('readonly');if(saved)archive=normalizeState(saved);}catch(e){console.warn('IndexedDB unavailable:',e);try{localStorage.setItem('__ma_test','1');localStorage.removeItem('__ma_test');storageMode='localstorage';const saved=localStorage.getItem(DB_KEY);if(saved)archive=normalizeState(JSON.parse(saved));toast('Stockage de secours activé : pense à exporter tes sauvegardes.');}catch(err){storageMode='memory';toast('Stockage persistant indisponible : tes modifications seront temporaires.',true);}}await importRapliPdfCatalogue();render();}
function normalizeState(s){if(!s||!Array.isArray(s.groups)||!Array.isArray(s.variants)||!Array.isArray(s.copies)||!Array.isArray(s.wishlist))throw new Error('Fichier de sauvegarde non conforme');return {version:1,groups:s.groups,variants:s.variants,copies:s.copies,wishlist:s.wishlist,createdAt:s.createdAt||now()};}
function navigate(view,group=null,variant=null){currentView=view;currentGroup=group;currentVariant=variant;searchTerm='';activeFilter='all';$('#sidebar')?.classList.remove('open');$('#mobile-backdrop').hidden=true;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const main=$('#main-content');if(!main)return;let breadcrumb='ACCUEIL';let html='';if(currentView==='dashboard'){html=dashboardView();}
else if(currentView==='watches'||currentView==='cards'){const label=currentView==='watches'?'DRAGON BLANC':'DRAGON BLANC';breadcrumb=label;if(currentVariant&&getVariant(currentVariant)){html=variantView(getVariant(currentVariant));breadcrumb+=' / FICHE';}else if(currentGroup&&getGroup(currentGroup)){html=groupView(getGroup(currentGroup));breadcrumb+=' / '+getGroup(currentGroup).name.toUpperCase();}else html=categoryView(currentView);}
else if(currentView==='collection'){breadcrumb='MA COLLECTION';html=collectionView();}
else if(currentView==='wishlist'){breadcrumb='WISHLIST';html=wishlistView();}
else if(currentView==='tools'){breadcrumb='DONNÉES & SAUVEGARDES';html=toolsView();}
else html=dashboardView();main.innerHTML=html;$('#breadcrumb').textContent=breadcrumb;
document.querySelectorAll('.nav-item[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===currentView));$('#watch-total').textContent=archive.variants.filter(v=>catForGroup(v.groupId)==='watches').length;$('#card-total').textContent=archive.variants.filter(v=>catForGroup(v.groupId)==='cards').length;$('#owned-total').textContent=archive.copies.length;$('#wish-total').textContent=archive.wishlist.length;}
function header(eyebrow,title,subtitle='',buttons=''){return `<div class="page-heading"><div>${eyebrow?`<div class="eyebrow">${h(eyebrow)}</div>`:''}<h1>${title}</h1>${subtitle?`<p class="page-subtitle">${subtitle}</p>`:''}</div>${buttons?`<div class="button-row">${buttons}</div>`:''}</div>`;}
function dashboardView(){const w=archive.variants.filter(v=>catForGroup(v.groupId)==='watches').length,c=archive.variants.length-w;
return `
<div class="compact-summary"><span><strong>${archive.variants.length}</strong> références</span><span><strong>${archive.copies.length}</strong> exemplaires</span><span><strong>${archive.wishlist.length}</strong> souhaits</span></div>
<div class="domain-grid"><button class="domain-tile" data-action="navigate" data-view="watches"><span class="domain-symbol">◷</span><span class="domain-body"><strong>Dragon Blanc</strong><small>${w} références · ${archive.groups.filter(g=>g.category==='watches').length} familles</small></span><span class="domain-arrow">→</span></button><button class="domain-tile" data-action="navigate" data-view="cards"><span class="domain-symbol">▧</span><span class="domain-body"><strong>Dragon Blanc</strong><small>${c} variantes · ${archive.groups.filter(g=>g.category==='cards').length} sets</small></span><span class="domain-arrow">→</span></button></div>
<div class="section-heading"><h2>Ajouts récents</h2><button class="text-link" data-action="new-variant">＋ Ajouter</button></div>${archive.variants.length?`<div class="reference-grid recent-grid">${[...archive.variants].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,8).map(referenceCard).join('')}</div>`:empty('Ton catalogue est vide','Commence par créer une famille Dragon Blanc ou un set de cartes.','new-group','Créer une édition')}`;}
function searchBar(placeholder){return `<label class="search-field"><span>⌕</span><input id="list-search" type="search" placeholder="${attr(placeholder)}" value="${attr(searchTerm)}" autocomplete="off"><kbd>Ctrl K</kbd></label>`;}
function categoryView(view){const category=view==='cards'?'cards':'watches',isWatch=category==='watches';const groups=archive.groups.filter(g=>g.category===category).filter(g=>!searchTerm||`${g.name} ${g.brand||''} ${g.year||''} ${g.sport||''}`.toLowerCase().includes(searchTerm.toLowerCase()));
const buttons=`<button class="primary-button" data-action="new-group" data-category="${category}">＋ ${isWatch?'Famille':'Set'}</button>`;
return `${header('',isWatch?'Dragon Blanc':'Dragon Blanc','',buttons)}<div class="toolbar">${searchBar(isWatch?'Chercher une famille…':'Chercher un set…')}</div><div class="group-grid">${groups.length?groups.map(groupCard).join(''):empty('Aucun résultat',searchTerm?'Modifie ta recherche.':'Crée ton premier groupe pour commencer.','new-group',isWatch?'Créer une famille':'Créer un set',category)}</div>`;}
function groupCard(g){const count=groupVariants(g.id).length,own=groupVariants(g.id).filter(v=>ownedCount(v.id)>0).length;return `<article class="group-card"><button class="group-open" data-action="open-group" data-id="${attr(g.id)}" aria-label="Ouvrir ${attr(g.name)}"><span class="group-icon">${iconFor(g.category)}</span><span class="group-main"><strong>${h(g.name)}</strong><small>${count} références · ${own} possédées</small></span><span class="group-chevron">→</span></button><button class="group-edit" data-action="edit-group" data-id="${attr(g.id)}" title="Modifier le groupe" aria-label="Modifier ${attr(g.name)}">⋯</button></article>`;}
function referenceCard(v){const own=ownedCount(v.id),wish=wishFor(v.id);const state=own?`<span class="tile-indicator owned" title="Possédée" aria-label="Possédée">✓</span>`:wish?`<span class="tile-indicator wish" title="Wishlist" aria-label="Wishlist">♡</span>`:'';
const cat=catForGroup(v.groupId);const secondary=(cat==='cards'?[v.player,v.parallel,v.serial]:[v.color,v.strapColor]).filter(Boolean).join(' · ');
return `<button class="reference-card" data-action="open-variant" data-id="${attr(v.id)}" aria-label="Ouvrir ${attr(titleFor(v))}"><span class="reference-image">${imageFor(v)}${state}</span><span class="reference-info"><strong title="${attr(v.reference||titleFor(v))}">${h(v.reference||titleFor(v))}</strong>${secondary?`<small title="${attr(secondary)}">${h(secondary)}</small>`:''}</span></button>`;}
function groupView(g){const variants=groupVariants(g.id).filter(v=>!searchTerm||[v.reference,v.label,v.color,v.player,v.parallel,v.team].join(' ').toLowerCase().includes(searchTerm.toLowerCase())).filter(v=>activeFilter==='all'||(activeFilter==='owned'?ownedCount(v.id)>0:activeFilter==='wish'?!!wishFor(v.id):true));const total=groupVariants(g.id).length,owned=groupVariants(g.id).filter(v=>ownedCount(v.id)>0).length;
const btns=`<button class="secondary-button light-button" data-action="edit-group" data-id="${attr(g.id)}" title="Modifier cette famille">⋯</button><button class="primary-button" data-action="new-variant" data-group="${attr(g.id)}">＋ Référence</button>`;
return `<button class="back-button" data-action="back-category">← ${g.category==='cards'?'Dragon Blanc':'Dragon Blanc'}</button>${header('',h(g.name),'',btns)}<div class="group-progress"><strong>${owned} / ${total}</strong> références possédées <span>${total?Math.round(owned/total*100):0}%</span></div><div class="toolbar">${searchBar('Rechercher une référence…')}<select class="filter-select" id="status-filter" aria-label="Filtre"><option value="all" ${activeFilter==='all'?'selected':''}>Toutes</option><option value="owned" ${activeFilter==='owned'?'selected':''}>Possédées</option><option value="wish" ${activeFilter==='wish'?'selected':''}>Wishlist</option></select></div><div class="reference-grid">${variants.length?variants.map(referenceCard).join(''):empty('Aucune référence',searchTerm||activeFilter!=='all'?'Aucun résultat pour ces filtres.':'Ajoute ta première référence.','new-variant','Ajouter une référence',g.id)}</div>`;}
function variantView(v){return ''; /* Les références s’ouvrent en aperçu compact, pas en page détaillée. */}
function openQuickView(v){const g=getGroup(v.groupId),own=ownedCount(v.id),wish=wishFor(v.id),copies=archive.copies.filter(c=>c.variantId===v.id);
const cat=g?.category==='cards'?'cards':'watches';const details=cat==='cards'?[v.player,v.parallel,v.serial]:[v.color,v.strapColor];const short=details.filter(Boolean).join(' · ');

<div class="quick-status"><button class="status-action ${own?'selected':''}" data-action="peek-own" data-id="${attr(v.id)}" aria-pressed="${own>0}">${own?'✓ Possédée'+(own>1?' ×'+own:''):'＋ Je possède'}</button><button class="status-action ${wish?'wish-selected':''}" data-action="peek-wish" data-id="${attr(v.id)}" aria-pressed="${!!wish}">${wish?'♥ Wishlist':'♡ Wishlist'}</button></div>
${own>0?`<div class="quick-copies">${copies.map((c,i)=>`<div class="quick-copy"><span>Exemplaire ${i+1}${c.condition?' · '+h(c.condition):''}</span><button class="mini-action" data-action="edit-copy" data-id="${attr(c.id)}" title="Modifier l'exemplaire">✎</button><button class="mini-action" data-action="delete-copy" data-id="${attr(c.id)}" title="Retirer cet exemplaire">×</button></div>`).join('')}<button class="quick-text-action" data-action="quick-own" data-id="${attr(v.id)}">＋ Ajouter un doublon</button></div>`:''}
<div class="quick-footer"><button class="quick-text-action" data-action="edit-variant" data-id="${attr(v.id)}">Modifier</button><button class="quick-text-action" data-action="duplicate-variant" data-id="${attr(v.id)}">Dupliquer</button><button class="quick-text-action danger-text" data-action="delete-variant" data-id="${attr(v.id)}">Supprimer</button></div></div>`;
openModal('',body,true);$('#modal-root .modal-header')?.classList.add('quick-modal-header');}
async function peekOwn(id){const v=getVariant(id);if(!v)return;const copies=archive.copies.filter(c=>c.variantId===id);if(!copies.length){archive.copies.push({id:uid(),variantId:id,condition:'',acquiredAt:'',price:null,serialNo:'',purchaseSource:'',notes:'',createdAt:now(),updatedAt:now()});}else if(copies.length===1){archive.copies=archive.copies.filter(c=>c.id!==copies[0].id);}else{toast('Pour retirer un doublon, utilise × sur son exemplaire.');return;}
if(await save()){render();openQuickView(v);}}
async function peekWish(id){const v=getVariant(id);if(!v)return;const w=wishFor(id);if(w)archive.wishlist=archive.wishlist.filter(x=>x.id!==w.id);else archive.wishlist.push({id:uid(),variantId:id,priority:'Normale',targetPrice:null,notes:'',createdAt:now(),updatedAt:now()});if(await save()){render();openQuickView(v);}}

function collectionView(){const copies=archive.copies.filter(c=>getVariant(c.variantId)).filter(c=>{const v=getVariant(c.variantId);return !searchTerm||`${v.label} ${v.reference} ${v.player} ${v.parallel} ${getGroup(v.groupId)?.name}`.toLowerCase().includes(searchTerm.toLowerCase());});return `${header('INVENTAIRE PRIVÉ','Ma collection','Chaque ligne représente un exemplaire réel : même si plusieurs exemplaires partagent la même référence.',`<button class="primary-button" data-action="new-copy">＋ Ajouter un exemplaire</button>`)}<div class="toolbar">${searchBar('Rechercher dans mes objets…')}</div>${copies.length?`<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Univers</th><th>État</th><th>Acquisition</th><th>Prix</th><th></th></tr></thead><tbody>${copies.map(c=>{const v=getVariant(c.variantId),g=getGroup(v.groupId);return `<tr><td><strong>${h(titleFor(v))}</strong><small>${h(v.reference||'')}</small></td><td>${h(g?.name||'')}</td><td>${h(c.condition||'—')}</td><td>${fmtDate(c.acquiredAt)}</td><td>${fmtEuro(c.price)}</td><td><button class="text-link" data-action="edit-copy" data-id="${attr(c.id)}">Modifier</button></td></tr>`;}).join('')}</tbody></table></div>`:empty('Aucun exemplaire à afficher',searchTerm?'Cette recherche ne correspond à aucun objet.':'Ajoute d’abord une référence à l’encyclopédie, puis indique quand tu en possèdes un exemplaire.','new-copy','Ajouter un exemplaire')}`;}
function wishlistView(){const list=archive.wishlist.filter(w=>getVariant(w.variantId)).filter(w=>{const v=getVariant(w.variantId);return !searchTerm||`${v.label} ${v.reference} ${v.player} ${v.parallel} ${getGroup(v.groupId)?.name}`.toLowerCase().includes(searchTerm.toLowerCase());});return `${header('PERSONAL WISHLIST','Mes recherches','Les objets à trouver, séparés des pièces que tu possèdes déjà.')}${`<div class="toolbar">${searchBar('Rechercher dans la wishlist…')}</div>`}${list.length?`<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Famille / Set</th><th>Priorité</th><th>Budget souhaité</th><th></th></tr></thead><tbody>${list.map(w=>{const v=getVariant(w.variantId);return `<tr><td><strong>${h(titleFor(v))}</strong><small>${h(v.reference||'')}</small></td><td>${h(getGroup(v.groupId)?.name||'')}</td><td><span class="pill wish">${h(w.priority||'Normale')}</span></td><td>${fmtEuro(w.targetPrice)}</td><td><button class="text-link" data-action="edit-wish" data-id="${attr(w.id)}">Modifier</button></td></tr>`;}).join('')}</tbody></table></div>`:empty('Ta wishlist est vide',searchTerm?'Essaie une autre recherche.':'Ouvre une fiche encyclopédique et utilise le bouton « Wishlist » pour l’ajouter ici.','navigate','Explorer Dragon Blanc','watches')}`;}

function empty(title,text,action,label,extra=''){return `<div class="empty-state"><div class="empty-icon">✦</div><h3>${h(title)}</h3><p>${h(text)}</p><button class="primary-button" data-action="${attr(action)}" ${action==='new-group'&&extra?`data-category="${attr(extra)}"`:action==='new-variant'&&extra?`data-group="${attr(extra)}"`:action==='navigate'&&extra?`data-view="${attr(extra)}"`:''}>＋ ${h(label)}</button></div>`;}
function openModal(title,body,small=false){$('#modal-root').innerHTML=`<div class="modal-screen" role="presentation"><section class="modal ${small?'small-modal':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><div class="eyebrow">RAPLI ARCHIVES / ÉDITION</div><h2 id="modal-title">${h(title)}</h2></div><button class="close-button" data-action="close-modal" aria-label="Fermer">×</button></div>${body}</section></div>`;modalImage=null;const input=$('#modal-root input:not([type=hidden]):not([type=file])');input?.focus();}
const field=(label,name,val='',opts={})=>`<div class="field ${opts.full?'full':''}"><label for="f-${name}">${h(label)}${opts.required?' *':''}</label>${opts.type==='textarea'?`<textarea id="f-${name}" name="${name}" ${opts.required?'required':''} placeholder="${attr(opts.placeholder||'')}">${h(val)}</textarea>`:opts.options?`<select id="f-${name}" name="${name}" ${opts.required?'required':''}>${opts.options.map(o=>`<option value="${attr(o[0])}" ${String(val)===String(o[0])?'selected':''}>${h(o[1])}</option>`).join('')}</select>`:`<input id="f-${name}" name="${name}" type="${opts.type||'text'}" value="${attr(val)}" ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.required?'required':''} placeholder="${attr(opts.placeholder||'')}">`}${opts.help?`<span class="help">${h(opts.help)}</span>`:''}</div>`;
function formWrap(type,id,fields,saveText='Enregistrer'){return `<form id="edit-form" data-form="${type}" data-id="${attr(id||'')}"><div class="form-grid">${fields}</div><div class="form-actions"><button class="secondary-button" type="button" data-action="close-modal">Annuler</button><button class="primary-button" type="submit">${h(saveText)}</button></div></form>`;}

function variantModal(id='',groupId='',clone=false){const existing=getVariant(id),v=existing?{...existing}:{};if(clone){v.reference='';v.label='';}const chosen=groupId||v.groupId||currentGroup||archive.groups[0]?.id;

let advanced=isWatch?field('Année','year',v.year)+field('Module','module',v.module)+field('Dimensions','dimensions',v.dimensions)+field('Boîtier','caseMaterial',v.caseMaterial)+field('Matière du bracelet','strap',v.strap)+field('Entrecorne (mm)','lugWidth',v.lugWidth,{type:'number',min:'0',step:'0.1'})+field('Disponibilité','availability',v.availability,{options:[['','Inconnue'],['Commercialisée','Commercialisée'],['Arrêtée','Arrêtée']]}):field('Équipe','team',v.team)+field('Rareté','rarity',v.rarity)+field('Type','cardType',v.cardType,{options:[['','Standard'],['Base','Base'],['Insert','Insert'],['Autograph','Autographe'],['Memorabilia','Memorabilia'],['Autre','Autre']]});

const defaultTags={
 dragons:{edition:[['Legend of Blue Eyes White Dragon','✦','#8b9fc9'],['Starter Deck Kaiba','◆','#7b9fce'],['Anniversary','★','#d0b777']],rarity:[['Common','●','#8e9799'],['Rare','◆','#5e87c8'],['Super Rare','✧','#78b9c7'],['Ultra Rare','★','#c5a75e'],['Secret Rare','✦','#9e8acb'],['Quarter Century Secret Rare','✶','#d3bd8b']],artwork:[['Original','◈','#6b94c0'],['Alternatif','✧','#9b82cd'],['Anniversaire','★','#dfbd6c']],language:[['Français','🇫🇷','#426dc7'],['Anglais','🇬🇧','#b34e55'],['Japonais','🇯🇵','#be464a'],['Coréen','🇰🇷','#6b90ca'],['Allemand','🇩🇪','#d9ae52'],['Italien','🇮🇹','#4a9c76'],['Espagnol','🇪🇸','#d5ad3f']]}

/* V1.7 — Actions rapides des tuiles Dragon Blanc */
const bundledArtworkPattern=/^assets\/artworks\/(A\d{2}|R0[1-4](?:-X)?)\.webp$/i;
const embeddedArtworkPattern=/^data:image\/(png|jpeg|jpg|webp);base64,/i;
function canDownloadArtwork(v){
  const src=String(v?.image||'');
  return bundledArtworkPattern.test(src)||embeddedArtworkPattern.test(src);
}
function artworkFileBase(v){
  const part=(value)=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,52);
  const match=String(v.image||'').match(bundledArtworkPattern);
  const code=match?.[1]||String(v.artwork||'').match(/(?:A\d{2}|R0[1-4](?:-X)?)/i)?.[0]||'ARTWORK';
  return 'Dragon_Blanc_'+[part(v.reference)||'Sans_reference',part(code),part(v.languageCode||v.language)].filter(Boolean).join('_');
}
function directDownload(url,filename){
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=filename;
  anchor.style.display='none';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
}
async function copyVariantReference(id){
  const reference=String(getVariant(id)?.reference||'').trim();
  if(!reference){toast('Aucune référence disponible.',true);return;}
  let copied=false;
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(reference);copied=true;}}catch(_e){}
  if(!copied){
    const input=document.createElement('textarea');
    input.value=reference;input.readOnly=true;
    input.style.position='fixed';input.style.opacity='0';input.style.pointerEvents='none';
    document.body.appendChild(input);input.focus();input.select();
    try{copied=!!document.execCommand('copy');}catch(_e){}
    input.remove();
  }
  toast(copied?'Référence copiée : '+reference:'Copie impossible dans ce navigateur.',!copied);

async function downloadVariantArtwork(id){
  const v=getVariant(id);
  if(!v||!canDownloadArtwork(v)){toast('Aucun artwork téléchargeable pour cette carte.',true);return;}
  const src=String(v.image),base=artworkFileBase(v);
  const bundled=src.match(bundledArtworkPattern);
  if(bundled){
    directDownload('assets/artworks/'+bundled[1]+'.png',base+'.png');
    toast('Téléchargement de l’artwork PNG lancé.');return;
  }
  try{
    const mime=src.match(embeddedArtworkPattern)?.[1]?.toLowerCase();
    if(mime==='png'||mime==='jpeg'||mime==='jpg'){
      // Preserve original PNG/JPG bytes and format, rather than recompressing.
      const response=await fetch(src);
      if(!response.ok)throw Error('Image non disponible');
      const blob=await response.blob();
      const blobUrl=URL.createObjectURL(blob);
      directDownload(blobUrl,base+'.'+(mime==='png'?'png':'jpg'));
      setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);
      toast('Téléchargement de l’artwork lancé.');return;
    }
    // For a user-added WebP, convert to lossless PNG (rather than saving as WebP).
    const picture=new Image();
    await new Promise((resolve,reject)=>{picture.onload=resolve;picture.onerror=()=>reject(Error('Image illisible'));picture.src=src;});
    const canvas=document.createElement('canvas');canvas.width=picture.naturalWidth;canvas.height=picture.naturalHeight;
    canvas.getContext('2d').drawImage(picture,0,0);
    const png=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Conversion impossible')),'image/png'));
    const url=URL.createObjectURL(png);directDownload(url,base+'.png');
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('Téléchargement de l’artwork PNG lancé.');
  }catch(err){toast('Téléchargement impossible : '+err.message,true);}
}
function referenceCard(v){

 const numbering=`<section class="settings-section"><h3>Numérotation des cartes Dragon Blanc</h3><p class="settings-intro">Définis le titre affiché sur les tuiles, puis choisis de montrer ou non le numéro.</p><div class="settings-number"><input type="text" data-setting-number="label" value="${attr(settings.numberLabel||'N° de carte')}" aria-label="Titre du numéro"><label><input type="checkbox" data-setting-number="visible" ${settings.showNumber?'checked':''}> Afficher le numéro sur la tuile</label></div></section>`;
 root.innerHTML=`${numbering}${sections}<div class="settings-footer"><button class="secondary-button" type="button" data-action="close-modal">Annuler</button><button class="primary-button" type="button" data-action="save-module-settings">Enregistrer les réglages</button></div>`;
}
async function badgeLogo(file){if(!file.type.startsWith('image/'))throw Error('Ce fichier n’est pas une image');if(file.size>5*1024*1024)throw Error('Logo limité à 5 Mo');const image=await new Promise((resolve,reject)=>{const i=new Image(),url=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(url);resolve(i);};i.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Logo illisible'));};i.src=url;});const canvas=document.createElement('canvas');const size=100;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,size,size);const ratio=Math.min(size/image.width,size/image.height);const w=image.width*ratio,h=image.height*ratio;ctx.drawImage(image,(size-w)/2,(size-h)/2,w,h);return canvas.toDataURL('image/png');}
async function saveModuleSettings(){if(!draftModuleSettings)return;for(const [cat,cfg] of Object.entries(draftModuleSettings)){if(cat!=='dragons')continue;for(const [key,entries] of Object.entries(cfg.taxonomies)){const seen=new Set();cfg.taxonomies[key]=entries.filter(entry=>entry.label?.trim()).map(entry=>({...entry,label:entry.label.trim(),color:/^#[0-9a-f]{6}$/i.test(entry.color)?entry.color:'#99b9aa',icon:(entry.icon||'').trim()})).filter(entry=>{const k=entry.label.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});}cfg.numberLabel=String(cfg.numberLabel||'N° de carte').trim().slice(0,40);}
const old=moduleSettings();for(const cat of Object.keys(MODULES)){for(const [key] of MODULES[cat].fields){const before=old[cat]?.taxonomies?.[key]||[],after=draftModuleSettings[cat]?.taxonomies?.[key]||[];for(const prev of before){const renamed=after.find(x=>x.id===prev.id);if(renamed&&prev.label!==renamed.label&&renamed.label){for(const v of archive.variants){if(catForGroup(v.groupId)===cat&&v[key]===prev.label)v[key]=renamed.label;}}}}}archive.settings=structuredClone(draftModuleSettings);const saved=await save();closeModal();render();if(saved)toast('Réglages des modules enregistrés ✓');}
// Non-destructive event handlers: one compact settings UI, all data stays local.
document.addEventListener('input',e=>{const el=e.target;if(!draftModuleSettings||!el.closest('.module-settings'))return;if(el.dataset.settingField){const list=draftModuleSettings[editingModule]?.taxonomies?.[el.dataset.settingField];if(list?.[Number(el.dataset.index)])list[Number(el.dataset.index)][el.dataset.settingPart]=el.value;}else if(el.dataset.settingNumber==='label')draftModuleSettings.dragons.numberLabel=el.value;else if(el.dataset.settingNumber==='visible')draftModuleSettings.dragons.showNumber=el.checked;});
document.addEventListener('change',async e=>{const el=e.target;if(!draftModuleSettings||!el.closest('.module-settings'))return;if(el.dataset.settingNumber==='visible')draftModuleSettings.dragons.showNumber=el.checked;if(el.dataset.settingLogo){const list=draftModuleSettings[editingModule]?.taxonomies?.[el.dataset.settingLogo],index=Number(el.dataset.index);if(!list?.[index]||!el.files?.[0])return;try{list[index].logo=await badgeLogo(el.files[0]);const label=el.closest('.file-logo');if(label)label.firstChild.textContent='✓ Logo';toast('Logo prêt à enregistrer');}catch(err){toast(err.message,true);}}});
document.querySelector('#quick-add').addEventListener('click',e=>{e.stopImmediatePropagation();pickAdd();},true);

document.addEventListener('change',e=>{if(e.target.matches('.meta-filter')){metaFilters[e.target.dataset.metaField]=e.target.value;render();}});

function collectionView(){const vs=dragonVariants().filter(v=>ownedCount(v.id)).filter(v=>!searchTerm||[v.reference,v.label,v.edition,v.rarity,v.artwork,v.language].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));return `${header('DRAGON BLANC','Ma collection',`${dragonCopies().length} exemplaires · ${vs.length} références distinctes`,`<button class="primary-button" data-action="new-copy">＋ Exemplaire</button>`)}<div class="toolbar">${searchBar('Rechercher parmi mes cartes…')}</div>${vs.length?`<div class="reference-grid">${vs.map(referenceCard).join('')}</div>`:empty('Aucune carte possédée',searchTerm?'Aucun résultat.':'Coche OWNED sur une tuile pour l’ajouter à ta collection.','navigate','Explorer le catalogue','dashboard')}`;}
function wishlistView(){const vs=dragonVariants().filter(v=>wishFor(v.id)).filter(v=>!searchTerm||[v.reference,v.label,v.edition,v.rarity,v.artwork,v.language].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));return `${header('DRAGON BLANC','Wishlist','Les versions que tu recherches encore.')}<div class="toolbar">${searchBar('Rechercher dans la wishlist…')}</div>${vs.length?`<div class="reference-grid">${vs.map(referenceCard).join('')}</div>`:empty('Wishlist vide',searchTerm?'Aucun résultat.':'Ajoute des cartes avec le cœur sur leur tuile.','navigate','Explorer le catalogue','dashboard')}`;}


function artworkThumbMarkup(item, fallback='◈'){
 const src=[item?.preview,item?.logo].find(v=>/^data:image\/(?:png|jpeg|webp);base64,/i.test(v||'')||/^assets\/artworks\/(?:A\d{2}|R0[1-4](?:-X)?)\.webp$/i.test(v||''));
 if(src)return `<img src="${attr(src)}" alt="" loading="lazy" decoding="async">`;
 const color=/^#[0-9a-f]{6}$/i.test(item?.color||'')?item.color:'#82bce5';
 return `<span class="artwork-placeholder" style="--artwork-accent:${color}">${h(item?.icon||fallback)}</span>`;
}
function renderArtworkFilter(){
 const root=document.getElementById('artwork-filter-options');
 const label=document.getElementById('artwork-selected-label');
 const thumb=document.getElementById('artwork-selected-thumb');
 if(!root||!label||!thumb)return;
 const fromTax=taxonomy('dragons','artwork');
 const fromCards=dragonVariants().map(v=>v.artwork).filter(Boolean);
 const choices=[...new Set((fromCards.length?fromCards:fromTax.map(x=>x.label)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
 const chosen=metaFilters.artwork||'';
 const item=fromTax.find(x=>x.label===chosen);
 label.textContent=chosen||'Tous les artworks';
 thumb.innerHTML=chosen?artworkThumbMarkup(item):'<span class="artwork-placeholder">◈</span>';
 root.innerHTML=`<button type="button" class="artwork-menu-option ${chosen===''?'selected':''}" data-artwork-option="" role="option" aria-selected="${chosen==='' }"><span class="artwork-thumb"><span class="artwork-placeholder">◈</span></span><span>Tous les artworks</span>${chosen===''?'<span class="artwork-selected-check">✓</span>':''}</button>`+
 choices.map(value=>{
  const obj=fromTax.find(x=>x.label===value);
  const selected=chosen===value;
  return `<button type="button" class="artwork-menu-option ${selected?'selected':''}" role="option" aria-selected="${selected}" data-artwork-option="${attr(value)}"><span class="artwork-thumb">${artworkThumbMarkup(obj)}</span><span>${h(value)}</span>${selected?'<span class="artwork-selected-check">✓</span>':''}</button>`;
 }).join('');
}
function setArtworkMenuOpen(open){
 const root=document.getElementById('artwork-filter-options'),trigger=document.getElementById('artwork-filter-trigger');
 if(!root||!trigger)return;
 root.hidden=!open;trigger.setAttribute('aria-expanded',String(open));
 if(open){const sel=root.querySelector('[aria-selected="true"]')||root.querySelector('button');sel?.scrollIntoView({block:'nearest'});}
}
function artworkSquarePreview(file){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/'))return reject(Error('Sélectionne une image valide.'));
  if(file.size>6*1024*1024)return reject(Error('Image limitée à 6 Mo.'));
  const img=new Image(),url=URL.createObjectURL(file);
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image illisible.'));};
  img.onload=()=>{
   URL.revokeObjectURL(url);
   const canvas=document.createElement('canvas');canvas.width=canvas.height=160;
   const ctx=canvas.getContext('2d');ctx.fillStyle='#f4f9ff';ctx.fillRect(0,0,160,160);
   // square crop centered on the artwork; the original uploaded file is not modified
   const side=Math.min(img.naturalWidth,img.naturalHeight);
   ctx.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,160,160);
   resolve(canvas.toDataURL('image/webp',.85));
  };
  img.src=url;
 });
}

 }

// Source Rapli Archives : import unique non destructif des 611 tirages classiques et 14 tirages Rush Duel.
async function importRapliPdfCatalogue(){
 const source=window.RAPLI_SOURCE_CATALOGUE;
 if(!source||!Array.isArray(source.cards))return;
 const cfg=moduleSettings();
 if(cfg.rapliPdfSeedVersion===source.version)return;
 const norm=v=>String(v||'').normalize('NFKC').toLocaleLowerCase('fr-FR').trim();
 const groupMap=new Map(archive.groups.filter(g=>g.category==='dragons').map(g=>[norm(g.name),g]));
 const existingIds=new Set(archive.variants.map(v=>v.id));
 const existingKeys=new Set(archive.variants.filter(v=>catForGroup(v.groupId)==='dragons').map(v=>[
  v.reference,v.artwork,v.rarity,v.language,v.edition,v.nameColor,v.editionStatus,v.market,v.sourceDate
 ].map(norm).join('|')));
 const sourceRows=source.cards;
 let added=0;
 for(const item of sourceRows){
   if(existingIds.has(item.id))continue;
   const signature=[item.reference,item.artwork,item.rarity,item.language,item.edition,item.nameColor,item.editionStatus,item.market,item.date].map(norm).join('|');
   if(existingKeys.has(signature))continue;
   const name=item.edition||'Origine non renseignée';
   let group=groupMap.get(norm(name));
   if(!group){group={id:'pdf-grp-'+String(groupMap.size+1).padStart(3,'0'),name,category:'dragons',description:'Édition relevée dans le catalogue PDF Rapli Archives',createdAt:'2026-11-10T00:00:00.000Z',updatedAt:'2026-11-10T00:00:00.000Z'};
     while(archive.groups.some(g=>g.id===group.id))group.id+='x';
     archive.groups.push(group);groupMap.set(norm(name),group);
   }
   archive.variants.push({id:item.id,groupId:group.id,reference:item.reference,label:item.reference,image:item.image,
      edition:item.edition,rarity:item.rarity,artwork:item.artwork,language:item.language,languageCode:item.languageCode,
      nameColor:item.nameColor,editionStatus:item.editionStatus,market:item.market,sourceDate:item.date,
      dragonNumber:item.reference,artworkCode:item.artworkCode,pdfPage:item.pdfPage,sourceDocument:item.sourceDoc,
      notes:[item.date,item.market,item.editionStatus,item.detail,'Source : '+source.source+' · p. '+item.pdfPage].filter(Boolean).join(' · '),
      createdAt:'2026-11-10T00:00:00.000Z',updatedAt:'2026-11-10T00:00:00.000Z'});
   existingIds.add(item.id);existingKeys.add(signature);added++;
 }
 // Complete the drop-down taxonomies without replacing customized icons, colors or labels.
 const settings=moduleSettings().dragons;
 const palette=['#71b7f0','#d5ae66','#63c7b0','#bda5ef','#e7a46e','#81a9df','#e1b7dc'];
 const updateTax=(field,label,extra={})=>{
   const values=settings.taxonomies[field];if(!values.some(v=>norm(v.label)===norm(label)))values.push({id:'pdf-'+field+'-'+values.length,label,color:palette[values.length%palette.length],icon:'',logo:'',...extra});
   else if(field==='artwork'){
     const cur=values.find(v=>norm(v.label)===norm(label));if(!cur.preview&&!cur.logo)cur.preview=extra.preview;
   }
 };
 source.artworks.forEach((a,i)=>updateTax('artwork',a.label,{preview:a.preview,icon:''}));
 [...new Set(sourceRows.map(x=>x.rarity))].forEach(v=>updateTax('rarity',v));
 const flags={'FR':'🇫🇷','EN':'🇬🇧','DE':'🇩🇪','IT':'🇮🇹','ES':'🇪🇸','PT':'🇵🇹','JP':'🇯🇵','KR':'🇰🇷','SC':'🇨🇳','TC':'🇹🇼'};
 [...new Map(sourceRows.map(x=>[x.language,x.languageCode])).entries()].forEach(([v,k])=>updateTax('language',v,{icon:flags[k]||''}));
 [...new Set(sourceRows.map(x=>x.edition))].forEach(v=>updateTax('edition',v));
 cfg.rapliPdfSeedVersion=source.version;
 await save();
}

// Dragon Blanc is the exclusive visible catalogue.
const rapliOriginalSave = save;
save = async (...args) => {
  const ok = await rapliOriginalSave(...args);
  if (ok) window.RapliCloud?.changed();
  return ok;
};
initialize().then(() => {
  window.RapliCloud?.init({
    get: () => archive,
    persist: () => rapliOriginalSave(),
    refresh: () => render()
  });
}).catch(error => console.error('Initialisation Rapli Archives:', error));
