:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--frame-max:1360px;--accent:#4d9af6;--frame-bg:#e7eff8;--frame-border:#b9cee5;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:radial-gradient(ellipse 880px 340px at 50% 0%,rgba(94,155,225,.13),transparent 75%),var(--frame-bg);color:#142036;transition:background-color .25s ease}
.portal{width:min(calc(100% - 48px),var(--frame-max));margin:20px auto 28px;border:1px solid var(--frame-border);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 18px 60px rgba(18,46,85,.13),0 1px 5px rgba(18,46,85,.05)}
.portal-header{position:relative;display:flex;align-items:center;justify-content:center;min-height:72px;padding:5px 12px 8px;background:linear-gradient(120deg,#09182c,#102e56 54%,#09182c);border-bottom:3px solid var(--accent)}
.portal-header::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 23%,rgba(255,255,255,.045) 52%,transparent 83%)}
.product-tabs{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,656px);gap:9px;align-items:center;justify-content:center}
.product-tab{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;width:100%;height:54px;padding:3px 8px;background:rgba(255,255,255,.055);border:1px solid rgba(226,239,251,.23);border-radius:11px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background-color .16s ease,box-shadow .16s ease}
.product-tab:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.product-tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
.product-tab[aria-selected="true"]{border-color:var(--accent);background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px var(--accent),0 4px 18px rgba(0,0,0,.17)}
.product-tab[aria-selected="true"]::after{content:"";position:absolute;left:35%;right:35%;bottom:-10px;height:3px;border-radius:4px;background:var(--accent)}
.product-tab img{display:block;max-width:100%;height:auto;max-height:46px;object-fit:contain;pointer-events:none}
.frame-wrap{width:100%;min-width:0;background:#fff}
.app-frame{display:block;width:100%;height:calc(100dvh - 123px);min-height:560px;border:0;background:#fff}
.app-frame[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:800px){
  .portal{width:100%;margin:0;min-height:100dvh;border:0;border-radius:0;box-shadow:none}
  .portal-header{min-height:60px;padding:4px 8px 7px}
  .product-tabs{gap:7px;width:min(100%,625px)}
  .product-tab{height:48px;border-radius:10px;padding:3px 6px}
  .product-tab img{max-height:41px}
  .product-tab[aria-selected="true"]::after{bottom:-9px}
  .app-frame{height:calc(100dvh - 60px);min-height:0}
}
@media(max-width:420px){

  .product-tab{height:44px;border-radius:8px;padding:3px 4px}
  .app-frame{height:calc(100dvh - 54px)}
}

/* V3.0 — Stronger active-tab affordance, designed around each brand accent */
.product-tab{overflow:visible;opacity:.78;filter:saturate(.72);border-width:2px;transition:transform .17s ease,opacity .17s ease,filter .17s ease,border-color .17s ease,background-color .17s ease,box-shadow .17s ease}
.product-tab:hover{opacity:1;filter:saturate(1);transform:translateY(-1px)}
.product-tab[aria-selected="true"]{opacity:1;filter:none;transform:translateY(-1px);border:2px solid var(--accent);background:rgba(255,255,255,.18)!important;box-shadow:0 0 0 1px rgba(255,255,255,.30) inset,0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent),0 6px 18px rgba(0,0,0,.18),0 0 22px color-mix(in srgb,var(--accent) 22%,transparent)}
.product-tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;width:auto;height:4px;bottom:-8px;border-radius:4px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.product-tab[aria-selected="true"]::before{content:"";position:absolute;right:9px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 10px var(--accent)}
.product-tab:focus-visible{outline:2px solid #fff;outline-offset:4px}
@media(max-width:800px){.product-tab[aria-selected="true"]::after{bottom:-7px}}
@media(max-width:420px){.product-tab[aria-selected="true"]::after{left:9px;right:9px;bottom:-7px}.product-tab[aria-selected="true"]::before{top:5px;right:5px;width:6px;height:6px}}

/* RAPLI LAB — one site-wide Cloud Save / Refresh pair for every workspace */
.portal-header{gap:12px}
.product-tabs{flex:1 1 auto;min-width:0;max-width:1110px}
.global-cloud-controls{
  display:flex;flex:0 0 auto;align-items:center;justify-content:center;
  gap:6px;position:relative;z-index:2;
}
.global-cloud-controls button{
  display:grid;place-items:center;width:42px;height:42px;
  border-radius:11px;border:1px solid #7894b4;
  background:rgba(250,253,255,.12);color:#e7f2ff;
  cursor:pointer;transition:background .16s,border-color .16s,transform .16s;
}
.global-cloud-controls button:hover:not(:disabled){background:rgba(222,240,255,.25);border-color:#c3dcf8;transform:translateY(-1px)}
.global-cloud-controls button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.global-cloud-controls button:disabled{cursor:wait;opacity:.6}
.global-cloud-controls button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.global-cloud-controls button.is-busy svg{animation:rapli-global-spin 1s linear infinite}
@keyframes rapli-global-spin{to{transform:rotate(360deg)}}
.global-cloud-controls .cloud-controls-caption{font:700 9px/1.3 Inter,system-ui,sans-serif;color:#d0e3f5;max-width:93px;overflow-wrap:anywhere}
#global-cloud-feedback{
  background:#eaf4ff;border-bottom:1px solid #b8d4f1;
  color:#173b5c;font:700 12px/1.5 Inter,system-ui,sans-serif;
  padding:8px 18px;text-align:center;position:relative;z-index:2;
}
#global-cloud-feedback[hidden]{display:none}
#global-cloud-feedback[data-status="error"]{background:#fff0f1;color:#963440;border-color:#e8b6bc}
#global-cloud-feedback details{margin:4px auto 0;max-width:720px;text-align:left;font-weight:500}
#global-cloud-feedback details summary{cursor:pointer;font-weight:700}
#global-cloud-feedback ul{margin:5px 0 4px;padding-left:20px}
#global-cloud-feedback:has(.global-cloud-dismiss){padding-left:50px;padding-right:50px}
#global-cloud-feedback .global-cloud-dismiss{
 position:absolute;top:50%;right:12px;transform:translateY(-50%);
 display:grid;place-items:center;width:30px;height:30px;border:1px solid #a9c6e4;
 border-radius:8px;background:rgba(255,255,255,.75);color:inherit;
 font:700 19px/1 Inter,system-ui,sans-serif;cursor:pointer;
}
#global-cloud-feedback .global-cloud-dismiss:hover{background:#fff;border-color:#729fcb}
#global-cloud-feedback .global-cloud-dismiss:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media(max-width:420px){
 #global-cloud-feedback:has(.global-cloud-dismiss){padding-left:38px;padding-right:38px}
 #global-cloud-feedback .global-cloud-dismiss{right:5px;width:28px;height:28px}
}
@media(max-width:1120px){
 .portal-header{flex-wrap:wrap;gap:7px}
 .product-tabs{flex:1 1 100%;max-width:100%}

/* RAPLI LAB — CHROME ARCHIVES MOSAIC + PREMIUM SPECTRUM.
   Desktop side gutters only; the portal remains above this background. */
@media(min-width:1100px){
  body{
    --side-logo:url("/assets/rapli-archives-mosaic-chrome.webp?v=20261117-hd");
    background:#050608;isolation:isolate;
  }
  body::before,body::after{
    content:"";display:block;position:fixed;inset:0;z-index:0;pointer-events:none;
  }
  /* Mint > royal blue > orange red > black > red > white > electric blue > black. */
  body::before{
    background-image:
      radial-gradient(circle at 19% 31%,rgba(255,255,255,.07) 0 .45px,transparent .8px),
      radial-gradient(circle at 73% 62%,rgba(0,0,0,.10) 0 .55px,transparent .9px),
      linear-gradient(180deg,rgba(3,5,9,.20) 0%,rgba(3,5,9,.06) 26%,rgba(3,5,9,.55) 65%,#050608 100%),
      linear-gradient(112deg,#68e6c7 0%,#2774dd 15%,#f36638 29%,#07080a 42%,#cb213b 55%,#f3f5f8 69%,#1682ff 84%,#050608 100%);
    background-size:7px 9px,11px 13px,cover,cover;
    background-blend-mode:soft-light,soft-light,normal,normal;
  }
  body::after{
    background-image:var(--side-logo);
    background-repeat:repeat;
    background-position:center 36px;
    background-size:clamp(350px,29vw,500px) auto;
    filter:grayscale(1);
    opacity:.08;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.92) 22%,rgba(0,0,0,.58) 65%,rgba(0,0,0,.07) 100%);
    mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.92) 22%,rgba(0,0,0,.58) 65%,rgba(0,0,0,.07) 100%);
  }
  .portal{position:relative;z-index:1}
}

/* Shared diskette: device pairing and whole-site backup manager */

 border:1px solid #b8c7d7;border-radius:17px;background:#fbfdff;color:#1b3650;
 box-shadow:0 22px 72px rgba(5,20,40,.38);overflow-y:auto}

 display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-radius:16px 16px 0 0}

/* Responsive portal: let the header and feedback determine the remaining height. */
.portal{display:flex;flex-direction:column;height:calc(100vh - 48px);height:calc(100dvh - 48px);min-height:0}
.portal-header{flex:0 0 auto;padding:8px 12px 10px}
#global-cloud-feedback{flex:0 0 auto;max-height:35vh;overflow-y:auto;overflow-wrap:anywhere}
.frame-wrap{flex:1 1 0;min-height:0}
.frame-wrap>section{height:100%;min-height:0}
.frame-wrap .app-frame{height:100%;min-height:0}
.portal-nav-strip{overflow:visible;gap:12px;touch-action:auto}
.portal-nav-strip .product-tabs{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 flex:1 1 0;width:auto;max-width:none;min-width:0;gap:8px;padding:0;
 overflow:visible;touch-action:auto;
}
.portal-nav-strip .product-tab{
 width:100%;min-width:0;height:56px;padding:5px 12px;
 opacity:1;filter:none;transform:none;border-radius:11px;
 background:linear-gradient(125deg,rgba(174,232,211,.17),rgba(235,222,195,.11))!important;
 background-clip:padding-box;
}
.portal-nav-strip .product-tab[aria-selected="true"]{
 background:linear-gradient(125deg,rgba(174,232,211,.29),rgba(235,222,195,.22))!important;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 3px 10px rgba(0,0,0,.13);
}
.portal-nav-strip .product-tab[aria-selected="true"]::after{
 bottom:2px;left:24%;right:24%;height:2px;box-shadow:none;
}
.portal-nav-strip .product-tab[aria-selected="true"]::before{display:none}
.portal-nav-strip .product-tab img{width:100%;height:100%;max-height:44px;object-fit:contain}
.portal-nav-strip .global-cloud-controls{flex:0 0 auto;gap:4px;padding:0}
.portal-nav-strip .global-cloud-controls button{width:44px;height:44px}
@media(hover:hover) and (pointer:fine){
 .portal-nav-strip .product-tab:hover{background:linear-gradient(125deg,rgba(174,232,211,.33),rgba(235,222,195,.26))!important}
}
@media(max-width:800px){
 .portal{height:100vh;height:100dvh;min-height:0}
 .portal-header{padding:calc(6px + env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) 8px max(6px,env(safe-area-inset-left,0px))}
 .portal-nav-strip{gap:6px}
 .portal-nav-strip .portal-brand{flex:0 0 48px;width:48px;height:40px}
 .portal-nav-strip .product-tabs{gap:6px}
 .portal-nav-strip .product-tab{height:48px;padding:4px 5px;border-radius:9px}
 .portal-nav-strip .product-tab img{max-height:38px}
 .frame-wrap{padding-bottom:env(safe-area-inset-bottom,0px)}
}
/* Keep the brands readable and all three cloud actions visible on small phones. */
@media(max-width:480px){
 .portal-nav-strip{display:grid;grid-template-columns:48px minmax(0,1fr);gap:6px}
 .portal-nav-strip .portal-brand{grid-column:1;grid-row:1}
 .portal-nav-strip .product-tabs{grid-column:2;grid-row:1}
 .portal-nav-strip .global-cloud-controls{grid-column:1 / -1;grid-row:2;justify-content:center}
}

/* Single editor access: cloud mutations are hidden unless the verified account is connected. */
.rapli-admin-controls{display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.rapli-admin-controls button{border:1px solid #a7c9cb;border-radius:8px;padding:8px 12px;background:#edf8f4;color:#24566b;font:800 10px/1.25 Inter,sans-serif;cursor:pointer}
.rapli-admin-controls button:hover{background:#d9f2e9}
.rapli-admin-controls button[hidden]{display:none}
#rapli-admin-message{font:600 10px/1.4 Inter,sans-serif;color:#536c80;max-width:300px}
html:not([data-rapli-role="editor"]) #global-cloud-save,
html:not([data-rapli-role="editor"]) #global-cloud-manage{display:none!important}
html:not([data-rapli-role="editor"]) #global-manager-save,
html:not([data-rapli-role="editor"]) #global-manager-refresh{display:none!important}
html[data-rapli-role="editor"] #rapli-admin-login{display:none}
@media(max-width:600px){
 .portal-footer{justify-content:center}
 .portal-footer-label{display:none}
 .rapli-admin-controls{margin-left:0}
 #rapli-admin-message{max-width:150px}
 .portal-footer .global-cloud-controls{margin-left:0}
}
/* Rapli Lab single-workspace presentation: Regatta stays in DOM and cloud sync. */
/* Removing the header must not remove the backing tabs used by cloud sync. */
.portal-hidden-navigation{display:none!important}
.portal-nav-strip{justify-content:center;overflow:visible}
.portal-nav-strip .product-tabs[hidden]{display:none!important}
.portal-header{padding:7px 12px 8px;min-height:0}
.portal-nav-strip .portal-brand{flex:0 0 160px;width:160px;height:57px}
.portal-nav-strip .portal-brand img{width:100%;height:100%;object-fit:contain}
/* The footer is inside the portal's flex column, below the scrolling iframe. */
.portal-footer{
  position:relative;flex:0 0 auto;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:7px 12px;
  min-height:50px;padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));
  border-top:1px solid #d1e0e9;background:linear-gradient(110deg,#f0faf7 0%,#f8fbff 55%,#faf6f1 100%);
}
.portal-footer-label{font:800 10px/1.3 Inter,system-ui,sans-serif;letter-spacing:.08em;color:#54748a}
.portal-footer .global-cloud-controls{display:flex;flex:0 0 auto;align-items:center;gap:6px;margin-left:auto;justify-content:flex-end;padding:0}
.portal-footer .global-cloud-controls button{
  width:35px;height:35px;border-radius:10px;border:1px solid #a9c9d4;
  background:rgba(255,255,255,.86);color:#255a76;
  box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(38,75,101,.07);
}
.portal-footer .global-cloud-controls button:hover:not(:disabled){
  background:#e8f9f2;color:#164d66;border-color:#78baa9;
  transform:translateY(-1px);
}
.portal-footer .global-cloud-controls button svg{width:20px;height:20px}
.portal-footer .global-cloud-controls button:focus-visible{outline:2px solid #319c87;outline-offset:2px}
.portal-footer #global-cloud-feedback{
  flex:1 0 100%;order:3;margin:0;padding:8px 38px 8px 12px;
  border:1px solid #bed9df;border-radius:9px;background:#eaf8f6;
  font-size:11px;text-align:left;max-height:27dvh;
}
.portal-footer #global-cloud-feedback[data-status="error"]{background:#fff0f1;border-color:#e8b6bc}
@media(max-width:800px){
  .portal-header{padding:calc(5px + env(safe-area-inset-top,0px)) 8px 6px}
  .portal-nav-strip{display:flex;justify-content:center}
  .portal-nav-strip .portal-brand{flex:0 0 128px;width:128px;height:48px}
  .frame-wrap{padding-bottom:0}
  .portal-footer{padding-inline:10px}
}
@media(max-width:480px){
  .portal-nav-strip{display:flex;justify-content:center}
  .portal-nav-strip .portal-brand{flex:0 0 118px;width:118px;height:44px}
  .portal-footer-label{font-size:9px}
  .portal-footer .global-cloud-controls button{width:33px;height:33px}
  .portal-footer .global-cloud-controls button svg{width:19px;height:19px}
}
</style>
  
  <link rel="stylesheet" href="shared/ios-input-focus.css">
  <script defer src="shared/ios-input-focus.js"></script>
  <!-- Keep session callback handling at the top-level after admin magic-link redirects. -->
  <script defer src="shared/admin-access.js"></script>
</head>
<body data-active="sports">
  <div class="portal">
    <!-- Projects share one portal; navigation is available from each Profile menu. -->
    <div class="portal-hidden-navigation" hidden aria-hidden="true">
      <nav class="product-tabs" role="tablist" aria-label="Choisir le projet Rapli" hidden aria-hidden="true">
          <button type="button" id="tab-sports" class="product-tab" data-product="sports" role="tab" aria-selected="true" aria-controls="panel-sports" tabindex="0" title="Rapli Sports — collection de cartes">
            <img src="sports/assets/logo.png" alt="Rapli Sports" draggable="false">
          </button>
          <button type="button" id="tab-regatta" class="product-tab" data-product="regatta" role="tab" aria-selected="false" aria-controls="panel-regatta" tabindex="-1" title="Rapli Regatta — journal de courses">
            <img src="regatta/assets/logo.webp" alt="Rapli Regatta" draggable="false">
          </button>
        </nav>
    </div>
    <div class="frame-wrap">
      <section id="panel-sports" role="tabpanel" aria-label="Rapli Sports">
        <iframe id="frame-sports" class="app-frame" data-src="sports/index.html" title="Rapli Sports — cartes de sport" loading="eager"></iframe>
      </section>
      <section id="panel-regatta" role="tabpanel" aria-labelledby="tab-regatta" hidden>
        <iframe id="frame-regatta" class="app-frame" data-src="regatta/index.html" title="Rapli Regatta — journal de courses" allow="clipboard-read; clipboard-write" loading="lazy"></iframe>
      </section>
    </div>

  </div>
  <script>
  (() => {
    'use strict';
    const projects=['sports','regatta'];
    // Both workspaces are available to visitors and verified editors via Profile navigation.
    const visibleProjects=['sports','regatta'];
    const tabs=Object.fromEntries(projects.map(n=>[n,document.getElementById('tab-'+n)]));
    const panels=Object.fromEntries(projects.map(n=>[n,document.getElementById('panel-'+n)]));
    const frames=Object.fromEntries(projects.map(n=>[n,document.getElementById('frame-'+n)]));
    const names={sports:'Sports',regatta:'Regatta'};
    let current='sports';
    const fromHash=()=>visibleProjects.includes(location.hash.slice(1).toLowerCase())?location.hash.slice(1).toLowerCase():'sports';
    function activity(name,active){
      const frame=frames[name];
      if(frame?.contentWindow&&frame.src)try{frame.contentWindow.postMessage({type:'RAPLI_APP_ACTIVITY',active},location.origin)}catch(_){}
    }
    function select(name,hash=false,focus=false){
      if(!visibleProjects.includes(name))name='sports';
      current=name;
      const frame=frames[name];
      if(!frame.src&&frame.dataset.src){frame.src=frame.dataset.src;delete frame.dataset.src;}
      document.body.dataset.active=name;
      for(const project of projects){
        const active=project===name;
        tabs[project].setAttribute('aria-selected',String(active));
        tabs[project].tabIndex=active?0:-1;
        panels[project].hidden=!active;frames[project].hidden=!active;
        activity(project,active);
      }
      document.title='Rapli Lab';
      if(hash&&location.hash!=='#'+name)history.pushState({project:name},'','#'+name);
      if(focus)tabs[name].focus();
    }
    for(const name of projects){
      tabs[name].addEventListener('click',()=>select(name,true));
      tabs[name].addEventListener('keydown',event=>{
        let next;
        if(event.key==='ArrowRight')next=projects[(projects.indexOf(name)+1)%projects.length];
        if(event.key==='ArrowLeft')next=projects[(projects.indexOf(name)+projects.length-1)%projects.length];
        if(event.key==='Home')next=projects[0];
        if(event.key==='End')next=projects[projects.length-1];
        if(next){event.preventDefault();select(next,true,true);}
      });
      frames[name].addEventListener('load',()=>activity(name,name===current));
    }
    window.addEventListener('popstate',()=>select(fromHash()));
    window.addEventListener('hashchange',()=>select(fromHash()));
    select(fromHash());

  })();
  </script>
  <script defer src="shared/retired-cleanup.js"></script>
</body>
</html>
