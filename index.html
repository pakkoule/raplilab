:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--frame-max:1360px;--accent:#4d9af6;--frame-bg:#e7eff8;--frame-border:#b9cee5;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:radial-gradient(ellipse 880px 340px at 50% 0%,rgba(94,155,225,.13),transparent 75%),var(--frame-bg);color:#142036;transition:background-color .25s ease}

body[data-active="tools"]{--accent:#ff951e;--frame-bg:#e5e8eb;--frame-border:#bcc2c9}
.portal{width:min(calc(100% - 48px),var(--frame-max));margin:20px auto 28px;border:1px solid var(--frame-border);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 18px 60px rgba(18,46,85,.13),0 1px 5px rgba(18,46,85,.05)}

body[data-active="tools"] .portal-header{background:linear-gradient(120deg,#2f373e,#495159 50%,#2f373e)}
.portal-header::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 23%,rgba(255,255,255,.045) 52%,transparent 83%)}
.product-tabs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,656px);gap:9px;align-items:center;justify-content:center}
.product-tab{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;width:100%;height:54px;padding:3px 8px;background:rgba(255,255,255,.055);border:1px solid rgba(226,239,251,.23);border-radius:11px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background-color .16s ease,box-shadow .16s ease}

.product-tab[aria-selected="true"]::after{content:"";position:absolute;left:35%;right:35%;bottom:-10px;height:3px;border-radius:4px;background:var(--accent)}
.product-tab img{display:block;max-width:100%;height:auto;max-height:46px;object-fit:contain;pointer-events:none}
.product-tab[data-product="archives"] img{max-width:93px;max-height:45px}

.product-tab[data-product="tools"] img{max-width:172px;max-height:46px}
.product-tab[data-product="stickers"]{background-color:rgba(16,30,40,.35)}
.product-tab[data-product="stickers"][aria-selected="true"]{background-color:rgba(48,104,104,.27)}
.product-tab[data-product="tools"][aria-selected="true"]{background-color:rgba(255,137,9,.12)}
.frame-wrap{width:100%;min-width:0;background:#fff}
.app-frame{display:block;width:100%;height:calc(100dvh - 123px);min-height:560px;border:0;background:#fff}
.app-frame[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* RAPLI LAB — one site-wide Cloud Save / Refresh pair for every workspace */
.portal-header{gap:12px}
.product-tabs{flex:1 1 auto;min-width:0;max-width:1110px}
.global-cloud-controls{
  display:flex;flex:0 0 auto;align-items:center;justify-content:center;
  gap:6px;position:relative;z-index:2;
}
.global-cloud-controls button{
  display:grid;place-items:center;width:42px;height:42px;
  border-radius:11px;border:1px solid #7894b4;
  background:rgba(250,253,255,.12);color:#e7f2ff;
  cursor:pointer;transition:background .16s,border-color .16s,transform .16s;
}
.global-cloud-controls button:hover:not(:disabled){background:rgba(222,240,255,.25);border-color:#c3dcf8;transform:translateY(-1px)}
.global-cloud-controls button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.global-cloud-controls button:disabled{cursor:wait;opacity:.6}
.global-cloud-controls button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.global-cloud-controls button.is-busy svg{animation:rapli-global-spin 1s linear infinite}
@keyframes rapli-global-spin{to{transform:rotate(360deg)}}
.global-cloud-controls .cloud-controls-caption{font:700 9px/1.3 Inter,system-ui,sans-serif;color:#d0e3f5;max-width:93px;overflow-wrap:anywhere}
#global-cloud-feedback{
  background:#eaf4ff;border-bottom:1px solid #b8d4f1;
  color:#173b5c;font:700 12px/1.5 Inter,system-ui,sans-serif;
  padding:8px 18px;text-align:center;position:relative;z-index:2;
}
#global-cloud-feedback[hidden]{display:none}
#global-cloud-feedback[data-status="error"]{background:#fff0f1;color:#963440;border-color:#e8b6bc}
#global-cloud-feedback details{margin:4px auto 0;max-width:720px;text-align:left;font-weight:500}
#global-cloud-feedback details summary{cursor:pointer;font-weight:700}
#global-cloud-feedback ul{margin:5px 0 4px;padding-left:20px}
#global-cloud-feedback:has(.global-cloud-dismiss){padding-left:50px;padding-right:50px}
#global-cloud-feedback .global-cloud-dismiss{
 position:absolute;top:50%;right:12px;transform:translateY(-50%);
 display:grid;place-items:center;width:30px;height:30px;border:1px solid #a9c6e4;
 border-radius:8px;background:rgba(255,255,255,.75);color:inherit;
 font:700 19px/1 Inter,system-ui,sans-serif;cursor:pointer;
}
#global-cloud-feedback .global-cloud-dismiss:hover{background:#fff;border-color:#729fcb}
#global-cloud-feedback .global-cloud-dismiss:focus-visible{outline:2px solid currentColor;outline-offset:2px}

 #global-cloud-feedback:has(.global-cloud-dismiss){padding-left:38px;padding-right:38px}
 #global-cloud-feedback .global-cloud-dismiss{right:5px;width:28px;height:28px}
}

/* RAPLI LAB — PREMIUM LATERAL BRAND ATMOSPHERE (option C)
   Draw behind the existing portal, without changing its size or iframe behavior. */
@media (min-width:1100px) {
  body { --side-theme:#1a416c; --side-logo:url("assets/archives-logo.webp"); background:#050708; isolation:isolate; }
  body[data-active="archives"] {--side-theme:#1a416c;--side-logo:url("assets/archives-logo.webp")}
  body[data-active="sports"] {--side-theme:#15519b;--side-logo:url("sports/assets/logo.png")}
  body[data-active="time"] {--side-theme:#76603f;--side-logo:url("time/assets/logo.png")}
  body[data-active="refs"] {--side-theme:#176d67;--side-logo:url("refs/assets/logo.png")}
  body[data-active="stickers"] {--side-theme:#19715b;--side-logo:url("assets/stickers-logo.webp")}
  body[data-active="tools"] {--side-theme:#a86521;--side-logo:url("assets/tools-logo.webp")}
  body[data-active="tiers"] {--side-theme:#766b32;--side-logo:url("assets/tiers-mosaic-hd.webp")}
  body[data-active="top10"] {--side-theme:#24548e;--side-logo:url("assets/top10-mosaic-hd.webp")}
  body[data-active="coach"] {--side-theme:#4e6c51;--side-logo:url("assets/coach-mosaic-hd.webp")}
  body[data-active="lp"] {--side-theme:#40414d;--side-logo:url("assets/lp-mosaic-hd.webp")}
  body::before,body::after {
    content:"";display:block;position:fixed;inset:0;z-index:0;pointer-events:none;
  }
  /* Brand-tinted upper edges, atmospheric middle and near-black bottom. */
  body::before {
    background:
      radial-gradient(ellipse 45% 45% at 0% 5%,color-mix(in srgb,var(--side-theme) 58%,#a6a7a2) 0%,transparent 75%),
      radial-gradient(ellipse 45% 55% at 100% 12%,color-mix(in srgb,var(--side-theme) 65%,#899598) 0%,transparent 76%),
      linear-gradient(180deg,color-mix(in srgb,var(--side-theme) 88%,#0a1012) 0%,color-mix(in srgb,var(--side-theme) 55%,#080b10) 34%,#101417 66%,#040506 100%);
  }
  /* Monochrome photo texture: retain light/dark image detail and original alpha.
     Avoid upscaling lightweight navigation logos beyond their useful resolution. */
  body::after {
    background-image:var(--side-logo);background-repeat:repeat;
    background-position:center 36px;background-size:clamp(350px,29vw,500px) auto;
    filter:grayscale(1);opacity:.10;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.95) 24%,rgba(0,0,0,.65) 67%,rgba(0,0,0,.22) 100%);
    mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.95) 24%,rgba(0,0,0,.65) 67%,rgba(0,0,0,.22) 100%);
  }
  /* Rapli Time — option A : composition latérale libre, sans mosaïque répétitive.
     Huit impressions de la même identité, quatre de chaque côté.
     Le dégradé général ci-dessus reste inchangé. */
  body[data-active="time"]::after {
    background-image:
      var(--side-logo), var(--side-logo), var(--side-logo), var(--side-logo),
      var(--side-logo), var(--side-logo), var(--side-logo), var(--side-logo);
    background-repeat: no-repeat;
    background-size:
      285px auto, 205px auto, 350px auto, 230px auto,
      225px auto, 330px auto, 190px auto, 275px auto;
    background-position:
      left -32px top 34px,
      left 60px top 244px,
      left -82px top 490px,
      left 48px bottom 46px,
      right 18px top 96px,
      right -76px top 326px,
      right 72px top 570px,
      right -18px bottom 58px;
    filter: grayscale(1);
    opacity: .09;
  }
  .portal {position:relative;z-index:1}
}
/* Mobile and small tablets preserve the original lightweight background. */

      <div class="global-cloud-controls" role="group" aria-label="Synchronisation globale RapliLab">
        <button id="global-cloud-save" type="button" title="Enregistrer les dix espaces dans Supabase" aria-label="Enregistrer tous les espaces RapliLab dans le cloud">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .65-7.95A6.2 6.2 0 0 0 6 8.6 4.7 4.7 0 0 0 7 18Z"/><path d="M12 10v8m-3-3 3 3 3-3"/></svg>
        </button>
        <button id="global-cloud-refresh" type="button" title="Actualiser les dix espaces depuis Supabase" aria-label="Récupérer les modifications de tous les espaces RapliLab depuis le cloud">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.25-5L3 8.5"/><path d="M3 3.5v5h5"/><path d="M4 13a8 8 0 0 0 14.25 5L21 15.5"/><path d="M21 20.5v-5h-5"/></svg>
        </button>
        <span class="cloud-controls-caption">TOUT RAPLILAB</span>
      </div>
    </header>
    <div id="global-cloud-feedback" role="status" aria-live="polite" hidden></div>
    <div class="frame-wrap">
      <section id="panel-archives" role="tabpanel" aria-labelledby="tab-archives" hidden>
        <iframe id="frame-archives" class="app-frame" data-src="archives/index.html" title="Rapli Archives — catalogue Dragon Blanc aux Yeux Bleus" allow="clipboard-read; clipboard-write" loading="eager"></iframe>
      </section>
      <section id="panel-sports" role="tabpanel" aria-labelledby="tab-sports" hidden>
        <iframe id="frame-sports" class="app-frame" data-src="sports/index.html" title="Rapli Sports — cartes de sport" loading="lazy"></iframe>
      </section>
      <section id="panel-time" role="tabpanel" aria-labelledby="tab-time" hidden>
        <iframe id="frame-time" class="app-frame" data-src="time/index.html" title="Rapli Time — montres personnelles" loading="lazy"></iframe>
      </section>
      <section id="panel-refs" role="tabpanel" aria-labelledby="tab-refs" hidden>
        <iframe id="frame-refs" class="app-frame" data-src="refs/index.html" title="Rapli Refs — carnet de références" loading="lazy"></iframe>
      </section>
      <section id="panel-stickers" role="tabpanel" aria-labelledby="tab-stickers" hidden>
        <iframe id="frame-stickers" class="app-frame" data-src="stickers/index.html" title="Rapli Stickers Lab — éditeur de stickers" allow="clipboard-read; clipboard-write" loading="lazy"></iframe>
      </section>
      <section id="panel-tiers" role="tabpanel" aria-labelledby="tab-tiers" hidden>
        <iframe id="frame-tiers" class="app-frame" data-src="tiers/index.html" title="Rapli Top Tiers — classements personnalisables" allow="clipboard-read; clipboard-write" loading="lazy"></iframe>
      </section>
      <section id="panel-top10" role="tabpanel" aria-labelledby="tab-top10" hidden>
        <iframe id="frame-top10" class="app-frame" data-src="top10/index.html" title="Rapli Top 10 — classement personnalisé" allow="clipboard-read; clipboard-write" loading="lazy"></iframe>
      </section>
      <section id="panel-coach" role="tabpanel" aria-labelledby="tab-coach" hidden>
        <iframe id="frame-coach" class="app-frame" data-src="coach/index.html" title="Rapli Coach — football et basketball" loading="lazy"></iframe>
      </section>
      <section id="panel-lp" role="tabpanel" aria-labelledby="tab-lp" hidden>
        <iframe id="frame-lp" class="app-frame" data-src="lp/index.html" title="Rapli LP — collection de CD de musique" loading="lazy"></iframe>
      </section>
      <section id="panel-tools" role="tabpanel" aria-labelledby="tab-tools">
        <iframe id="frame-tools" class="app-frame" data-src="tools/index.html" title="Rapli Tools — PDF, détourage, upscale et retouche photo" allow="clipboard-read; clipboard-write" loading="lazy"></iframe>
      </section>
    </div>
  </div>
  <script>
  (() => {
    'use strict';
    const projects=['archives','sports','time','refs','stickers','tools','tiers','top10','coach','lp'];
    const tabs=Object.fromEntries(projects.map(name=>[name,document.getElementById('tab-'+name)]));
    const panels=Object.fromEntries(projects.map(name=>[name,document.getElementById('panel-'+name)]));
    const frames=Object.fromEntries(projects.map(name=>[name,document.getElementById('frame-'+name)]));
    let current='tools';
    // Inactive apps can pause noncritical thumbnail/pixel work without losing state.
    const sendActivity=(project,isActive)=>{const frame=frames[project];if(frame?.contentWindow&&frame?.src)try{frame.contentWindow.postMessage({type:'RAPLI_APP_ACTIVITY',active:isActive},location.origin)}catch(e){}};
    const fromHash=()=>{const name=location.hash.slice(1).toLowerCase();return projects.includes(name)?name:'tools';};
    function select(name, updateHash=false, focus=false) {
      if(!projects.includes(name))name='tools';
      if(name!==current && current==='coach'){
        try{
          if(frames.coach?.contentWindow?.RapliCoach?.hasUnsaved?.() &&
             !confirm('Rapli Coach contient des modifications non enregistrées. Quitter ce terrain ?')){
            if(location.hash!=='#coach')history.replaceState({project:'coach'},'', '#coach');
            return;
          }
        }catch(e){/* iframe not yet initialized */ }
      }
      current=name;
      // Do not launch the heavyweight editors (and their model libraries) until visited.
      const frame=frames[name];
      if(!frame.src && frame.dataset.src){frame.src=frame.dataset.src;delete frame.dataset.src;}
      document.body.dataset.active=name;
      for(const project of projects){
        const active=project===name;
        tabs[project].setAttribute('aria-selected',String(active));
        tabs[project].tabIndex=active?0:-1;
        panels[project].hidden=!active;
        frames[project].hidden=!active;
        sendActivity(project,active);
      }
      document.title=({archives:'RAPLI — Archives · Dragon Blanc aux Yeux Bleus',sports:'RAPLI — Sports',time:'RAPLI — Time',refs:'RAPLI — Refs',stickers:'RAPLI — Stickers Lab',tools:'RAPLI — Tools',tiers:'RAPLI — Top Tiers',top10:'RAPLI — Top 10',coach:'RAPLI — Coach',lp:'RAPLI — LP'})[name];
      if(updateHash && location.hash !=='#'+name)history.pushState({project:name},'', '#'+name);
      // Keep the active tab visible in the one-row mobile scroll rail.
      if(window.matchMedia('(max-width: 800px)').matches){
        const rail=tabs[name].parentElement;
        const selected=tabs[name];
        const left=Math.max(0,selected.offsetLeft-(rail.clientWidth-selected.offsetWidth)/2);
        rail.scrollTo({left,behavior:updateHash?'smooth':'auto'});
      }
      if(focus)tabs[name].focus();
    }
    for(const name of projects){
      tabs[name].addEventListener('click',()=>select(name,true));
      tabs[name].addEventListener('keydown',e=>{
        let next;
        if(e.key==='ArrowRight')next=projects[(projects.indexOf(name)+1)%projects.length];
        else if(e.key==='ArrowLeft')next=projects[(projects.indexOf(name)+projects.length-1)%projects.length];
        else if(e.key==='Home')next=projects[0];
        else if(e.key==='End')next=projects[projects.length-1];
        if(next){e.preventDefault();select(next,true,true);}
      });
    }
    addEventListener('popstate',()=>select(fromHash()));
    addEventListener('hashchange',()=>select(fromHash()));
    // Re-send state once iframes have finished their first load.
    for(const name of projects)frames[name].addEventListener('load',()=>sendActivity(name,name===current));
    select(fromHash());

    // One global action, executed separately for each isolated private collection.
    // Lazy iframes are loaded on demand, including the inactive modules.
    const cloudNames={archives:'Archives',sports:'Sports',time:'Time',refs:'Refs',stickers:'Stickers Lab',tools:'Tools',tiers:'Top Tiers',top10:'Top 10',coach:'Coach',lp:'LP'};
    const cloudSave=document.getElementById('global-cloud-save');
    const cloudRefresh=document.getElementById('global-cloud-refresh');
    const cloudFeedback=document.getElementById('global-cloud-feedback');
    let globalCloudBusy=false,requestSequence=0;
    const cloudPause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    async function ensureCloudFrame(name) {
      const frame=frames[name];
      if(!frame)throw Error('Onglet introuvable.');
      if(!frame.src&&frame.dataset.src){
        frame.loading='eager';
        frame.src=frame.dataset.src;
        delete frame.dataset.src;
      }
      const started=Date.now();
      while(Date.now()-started<45000) {
        try{
          const app=frame.contentWindow;
          const initialized=name==='archives'
            ? app?.RapliCloud?.isInitialized?.()
            : app?.RapliModuleBridge?.ready && !!app?.RapliModuleCloud;
          if(initialized)return frame;
        }catch(e){ /* Same-origin check, retry while iframe initializes. */ }
        await cloudPause(200);
      }
      throw Error('Application non initialisée. Ouvre cet onglet et réessaie.');
    }
    async function syncCloudModule(name,operation) {
      const frame=await ensureCloudFrame(name);
      const id='global-'+Date.now().toString(36)+'-'+(++requestSequence)+'-'+name;
      return new Promise((resolve,reject)=>{
        let timeout;
        function cleanup(){clearTimeout(timeout);window.removeEventListener('message',receive);}
        function receive(event){
          const data=event.data;
          if(event.origin!==location.origin||event.source!==frame.contentWindow||
             data?.type!=='RAPLI_GLOBAL_SYNC_RESULT'||data.id!==id||
             data.module!==name||data.operation!==operation)return;
          cleanup();
          resolve({success:!!data.success,message:String(data.message||''),conflict:!!data.conflict});
        }
        window.addEventListener('message',receive);
        timeout=setTimeout(()=>{cleanup();reject(Error('Délai de synchronisation dépassé'));},120000);
        try{
          frame.contentWindow.postMessage({type:'RAPLI_GLOBAL_SYNC_REQUEST',id,module:name,operation},location.origin);
        }catch(e){cleanup();reject(e);}
      });
    }
    const escapeCloud=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function reportGlobalCloud(operation,completed,results) {
      const errors=results.filter(r=>!r.success);
      const successes=results.length-errors.length;
      const title=operation==='save'?'Sauvegarde':'Actualisation';
      const progress=completed<projects.length;
      cloudFeedback.hidden=false;
      cloudFeedback.dataset.status=errors.length?'error':'ok';
      if(progress){
        cloudFeedback.textContent=title+' globale : '+completed+'/'+projects.length+' espaces vérifiés…';
      }else{
        const summary=title+' globale · '+successes+'/'+projects.length+
          ' espaces '+(successes===projects.length?'synchronisés ✓':'réussis');
        const detail=errors.length
          ? '<details open><summary>'+errors.length+' espace(s) à vérifier</summary><ul>'+
              errors.map(e=>'<li><strong>'+escapeCloud(cloudNames[e.name])+'</strong> : '+escapeCloud(e.message)+'</li>').join('')+
            '</ul></details>'
          : '<details><summary>Afficher le détail des dix espaces</summary><ul>'+
              results.map(e=>'<li>'+escapeCloud(cloudNames[e.name])+' : '+escapeCloud(e.message)+'</li>').join('')+
            '</ul></details>';
        cloudFeedback.innerHTML='<strong>'+escapeCloud(summary)+'</strong>'+detail+
          '<button type="button" class="global-cloud-dismiss" aria-label="Masquer le résultat de la synchronisation" title="Fermer ce message">×</button>';
      }
    }
    async function runGlobalCloud(operation) {
      if(globalCloudBusy)return;
      globalCloudBusy=true;
      cloudSave.disabled=cloudRefresh.disabled=true;
      const active=operation==='save'?cloudSave:cloudRefresh;
      active.classList.add('is-busy');
      active.setAttribute('aria-busy','true');
      const results=[];
      try{
        reportGlobalCloud(operation,0,results);
        for(const name of projects){
          let response;
          try{response=await syncCloudModule(name,operation);}
          catch(e){response={success:false,message:e?.message||'Synchronisation indisponible'};}
          results.push({name,...response});
          reportGlobalCloud(operation,results.length,results);
        }
      }finally{
        globalCloudBusy=false;
        cloudSave.disabled=cloudRefresh.disabled=false;
        active.classList.remove('is-busy');
        active.removeAttribute('aria-busy');
      }
    }
    cloudFeedback.addEventListener('click',event=>{
      if(event.target.closest('.global-cloud-dismiss') && !globalCloudBusy){
        cloudFeedback.hidden=true;
      }
    });
    cloudSave.addEventListener('click',()=>void runGlobalCloud('save'));
    cloudRefresh.addEventListener('click',()=>void runGlobalCloud('refresh'));
  })();
  </script>
</body>
</html>
