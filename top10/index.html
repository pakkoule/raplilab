<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf0f4">
  <title>Rapli Top 10 — Le Lab de Rapli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="workspace" aria-label="Éditeur de classement Rapli Top 10">
      <div class="editor-content">
        <div class="heading">
          <label for="list-title" class="sr-only">Titre du classement</label>
          <input type="text" id="list-title" maxlength="160" placeholder="Mon Top 10" autocomplete="off">
          <span id="dirty-dot" class="dirty-dot" hidden title="Modifications non enregistrées" aria-label="Modifications non enregistrées">●</span>
        </div>
        <div class="primary-actions">
          <button id="new-list" class="button ghost" type="button">＋ NOUVEAU</button>
          <button id="library-toggle" class="button ghost" type="button">▤ BIBLIOTHÈQUE</button>
          <button id="save-list" class="button blue" type="button">▣ ENREGISTRER</button>
        </div>
        <div class="tool-row" role="group" aria-label="Personnaliser le classement">
          <button data-panel="presentation" class="tool-button is-active" type="button">▦ PRÉSENTATION</button>
          <button data-panel="style" class="tool-button" type="button">◉ STYLE</button>
          <button data-panel="layout" class="tool-button" type="button">≡ COLONNES</button>
          <button data-panel="export" class="tool-button" type="button">⇩ EXPORT PNG</button>
        </div>
        <section id="settings" class="settings" aria-label="Réglages du classement"></section>
        <section id="library" class="library" aria-label="Bibliothèque des classements" hidden>
          <header class="panel-heading"><strong>MES CLASSEMENTS</strong><button type="button" class="close" id="close-library" aria-label="Fermer la bibliothèque">✕</button></header>
          <div class="library-toolbar">
            <input id="library-search" type="search" placeholder="Rechercher par titre…" aria-label="Rechercher un classement">
            <select id="library-sort" aria-label="Trier la bibliothèque">
              <option value="recent">Plus récents</option><option value="old">Plus anciens</option><option value="az">Nom A → Z</option><option value="za">Nom Z → A</option>
            </select>
          </div>
          <div id="library-items" class="library-items"></div>
        </section>
        <div class="board-heading">
          <div><span class="eyebrow">CLASSEMENT PERSONNEL</span><h1 id="board-title">Mon Top 10</h1></div>
          <div class="board-heading-actions">
            <span id="count-label" class="count-label">10 POSITIONS</span>
            <label class="quick-count" for="quick-count">
              <span>TAILLE DU TOP</span>
              <select id="quick-count" aria-label="Choisir rapidement le nombre de positions">
                <option value="10">TOP 10</option>
              </select>
            </label>
            <div id="custom-count-wrap" class="custom-count" hidden>
              <label class="sr-only" for="custom-count">Nombre personnalisé de positions</label>
              <input id="custom-count" type="number" min="1" max="1000" step="1" inputmode="numeric" aria-label="Nombre personnalisé de positions">
              <button type="button" id="custom-count-apply" class="button small">OK</button>
              <button type="button" id="custom-count-cancel" class="button small ghost" aria-label="Annuler le nombre personnalisé">✕</button>
            </div>
            <button type="button" id="add-position" class="button small">＋ POSITION</button>
          </div>
        </div>
        <section id="position-editor" class="position-editor" aria-label="Modifier une position" hidden></section>
        <div class="preview-frame">
          <div id="ranking" class="ranking" data-theme="sport" data-mode="classic" aria-label="Aperçu éditable du classement"></div>
        </div>
        <div class="board-bottom">
          <button type="button" id="add-position-bottom" class="button ghost">＋ AJOUTER UNE POSITION</button>
          <span>Déplace avec les flèches ou la poignée. Clique sur une fiche pour la modifier.</span>
        </div>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
        <footer class="footer"><span>RAPLI TOP 10 · LE LAB DE RAPLI</span><span id="cloud-status">Sauvegarde manuelle</span></footer>
      </div>
    </section>
  </main>
  <input type="file" id="photo-picker" accept="image/png,image/jpeg,image/webp,image/gif,image/heic,image/heif,.heic,.heif" hidden>
  <input type="file" id="logo-picker" accept="image/png,image/jpeg,image/webp,image/gif,image/heic,image/heif,.heic,.heif" hidden>
  <script defer src="export.js"></script>
  <script defer src="app.js"></script>
  <script defer src="../shared/module-cloud.js"></script>
</body>
</html>
